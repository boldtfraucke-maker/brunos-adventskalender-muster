/* ---------- Hilfen ---------- */
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function lsGetJSON(k, dflt){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : dflt; }catch(e){ return dflt; } }
function lsSetJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ---------- Sudoku: allgemeiner Generator (4–16, Samurai) ---------- */
function sdBox(n){ return n===4 ? [2,2] : n===6 ? [2,3] : n===12 ? [3,4] : n===16 ? [4,4] : [3,3]; }
const SAM_OFF = [[0,0],[0,12],[6,6],[12,0],[12,12]];
const SD_SYMS = '123456789ABCDEFG';
const BITS = (()=>{ const t = new Uint8Array(1<<16); for(let i=1;i<t.length;i++) t[i] = t[i>>1] + (i&1); return t; })();
const sdGeomCache = {};
function sdGeom(S){
  const kind = S.kind || 'std', n = S.n, diag = !!S.genDiag;
  const ck = kind + n + (diag ? 'd' : '');
  if(sdGeomCache[ck]) return sdGeomCache[ck];
  let W, H, br, bc, act, units = [];
  const add = u => units.push(u);
  if(kind === 'samurai'){
    W = H = 21; br = bc = 3; act = new Array(W*H).fill(false);
    SAM_OFF.forEach(([r0,c0])=>{
      for(let a=0;a<9;a++){ const row = [], col = []; for(let b=0;b<9;b++){ row.push((r0+a)*W + c0+b); col.push((r0+b)*W + c0+a); } add(row); add(col); }
      for(let a=0;a<3;a++) for(let b=0;b<3;b++){ const box = []; for(let x=0;x<3;x++) for(let y=0;y<3;y++) box.push((r0+a*3+x)*W + c0+b*3+y); add(box); }
      for(let a=0;a<9;a++) for(let b=0;b<9;b++) act[(r0+a)*W + c0+b] = true;
    });
  } else {
    W = H = n; [br,bc] = sdBox(n); act = new Array(n*n).fill(true);
    for(let a=0;a<n;a++){ const row = [], col = []; for(let b=0;b<n;b++){ row.push(a*n+b); col.push(b*n+a); } add(row); add(col); }
    for(let r0=0;r0<n;r0+=br) for(let c0=0;c0<n;c0+=bc){ const box = []; for(let x=0;x<br;x++) for(let y=0;y<bc;y++) box.push((r0+x)*n + c0+y); add(box); }
    if(diag) add([...Array(n).keys()].map(k=>k*n+k));
  }
  const peerSets = Array.from({length:W*H}, ()=> new Set());
  units.forEach(u=> u.forEach(i=> u.forEach(j=>{ if(i!==j) peerSets[i].add(j); })));
  const G = { W, H, n, br, bc, act, units, peers: peerSets.map(s=>[...s]), cells: act.map((a,i)=>a?i:-1).filter(i=>i>=0) };
  return sdGeomCache[ck] = G;
}
function gSolve(G, grid, limit, randomize, maxNodes){
  const full = (1 << G.n) - 1, cells = G.cells, peers = G.peers;
  let count = 0, sol = null, nodes = 0, aborted = false;
  const candMask = i => { let m = 0; const p = peers[i]; for(let k=0;k<p.length;k++){ const v = grid[p[k]]; if(v) m |= 1 << (v-1); } return full & ~m; };
  const rec = ()=>{
    if(maxNodes && ++nodes > maxNodes){ aborted = true; return true; }
    let best = -1, bestM = 0, bestC = 99;
    for(let k=0;k<cells.length;k++){ const i = cells[k]; if(grid[i]) continue;
      const m = candMask(i), c = BITS[m & 0xffff] + BITS[m >>> 16];
      if(!c) return false;
      if(c < bestC){ best = i; bestM = m; bestC = c; if(c === 1) break; } }
    if(best < 0){ count++; if(!sol) sol = grid.slice(); return count >= limit; }
    const vals = []; for(let v=1; v<=G.n; v++) if(bestM & (1 << (v-1))) vals.push(v);
    if(randomize) shuffleArr(vals);
    for(const v of vals){ grid[best] = v; if(rec()){ grid[best] = 0; return true; } grid[best] = 0; }
    return false;
  };
  rec();
  return {count, sol, aborted};
}
const SD_TARGET = { '4':[9,7,6], '6':[20,16,13], '9':[38,31,26], '12':[84,72,62], '16':[150,128,112], 'S':[190,160,140] };
/* opts: {size:'4'|'6'|'9'|'12'|'16'|'S', level, mode:'code'|'word', word, markCount, dir:'row'|'col'|'diag'|'rand'|'cells'} */
async function buildSudokuAsync(opts, progress){
  const kind = opts.size === 'S' ? 'samurai' : 'std', n = kind === 'samurai' ? 9 : +opts.size;
  let mode = opts.mode, dir = opts.dir, word = opts.word || '';
  if(mode === 'word' && kind === 'samurai') dir = 'cells';
  if(mode === 'word' && (!dir || dir === 'rand')) dir = ['row','col','diag'][Math.floor(Math.random()*3)];
  const genDiag = mode === 'word' && dir === 'diag';
  const G = sdGeom({kind, n, genDiag}), Gp = sdGeom({kind, n});
  const tick = ()=> new Promise(r=> setTimeout(r, 0));
  let full = null;
  for(let t=0; t<30 && !full; t++){ const r = gSolve(G, new Array(G.W*G.H).fill(0), 1, true, 200000); if(r.sol && !r.aborted) full = r.sol; await tick(); }
  if(!full) throw new Error('Kein Sudoku gefunden, bitte nochmal versuchen.');
  const target = SD_TARGET[opts.size][opts.level];
  const puz = full.slice();
  let givens = G.cells.length, done = 0;
  const order = shuffleArr(G.cells.slice()), t0 = Date.now(), budget = kind === 'samurai' || n >= 12 ? 25000 : 8000;
  for(const i of order){
    if(givens <= target || Date.now() - t0 > budget) break;
    const keep = puz[i]; puz[i] = 0;
    const r = gSolve(Gp, puz.slice(), 2, false, n >= 12 || kind === 'samurai' ? 40000 : 0);
    if(r.aborted || r.count !== 1) puz[i] = keep; else givens--;
    if(++done % 8 === 0){ if(progress) progress(Math.min(99, Math.round((G.cells.length - givens) / (G.cells.length - target) * 100))); await tick(); }
  }
  let symbols = SD_SYMS.slice(0, n).split('');
  let marks = [], row = -1, answer;
  const W = G.W;
  if(mode === 'word' && dir !== 'cells'){
    const lines = [];
    if(dir === 'diag') lines.push([...Array(n).keys()].map(k=>k*n+k));
    else for(let a=0;a<n;a++) lines.push([...Array(n).keys()].map(k=> dir === 'col' ? k*n+a : a*n+k));
    let best = lines[0], bestEmpty = -1;
    for(const L of lines){ const e = L.filter(i=>!puz[i]).length; if(e > bestEmpty){ bestEmpty = e; best = L; } }
    symbols = new Array(n);
    best.forEach((i,k)=> symbols[full[i]-1] = word[k]);
    marks = best.slice(); row = Math.floor(best[0]/n);
    answer = word;
  } else if(mode === 'word'){
    const letters = [...new Set(word)];
    const FILL = 'SNRLDGBKFPWZVJXYQOAEIUMTCH'.split('').filter(c=> !letters.includes(c));
    const pool = letters.concat(FILL.slice(0, n - letters.length));
    const pos = G.cells.slice().sort((a,b)=>a-b), N = pos.length;
    let ok = false;
    for(let attempt=0; attempt<80 && !ok; attempt++){
      symbols = shuffleArr(pool.slice());
      const valOf = {}; symbols.forEach((c,k)=> valOf[c] = k+1);
      marks = []; let prev = -1; ok = true;
      for(let k=0;k<word.length;k++){
        const ideal = Math.floor((k+0.5) * N / word.length);
        let pick = -1, dist = 1e9;
        for(let q=prev+1; q<N; q++){ const i = pos[q]; if(puz[i] || full[i] !== valOf[word[k]]) continue; const dd = Math.abs(q - ideal); if(dd < dist){ dist = dd; pick = q; } else if(q > ideal) break; }
        if(pick < 0){ ok = false; break; }
        marks.push(pos[pick]); prev = pick;
      }
    }
    if(!ok) throw new Error('Das Wort ließ sich nicht unterbringen. Bitte nochmal erzeugen oder ein kürzeres Wort wählen.');
    answer = word;
  } else {
    const empties = shuffleArr(G.cells.filter(i=>!puz[i]));
    marks = empties.slice(0, Math.min(opts.markCount, empties.length)).sort((a,b)=>a-b);
    answer = marks.map(i=>symbols[full[i]-1]).join('');
  }
  const sym = (v,i) => !G.act[i] ? ' ' : v ? symbols[v-1] : '.';
  return { n, kind, W, mode, dir: mode === 'word' ? dir : '', row, marks, answer,
    sol: full.map(sym).join(''), puz: puz.map(sym).join(''), symbols: symbols.slice().sort().join(''), givens };
}
/* Rahmenlinien einer Zelle (Kästen, Ränder beim Samurai) */
function sdCellCls(G, i){
  const W = G.W, r = Math.floor(i/W), c = i%W, a = j => j >= 0 && j < G.act.length && G.act[j];
  const out = [];
  if((c+1)%G.bc===0 && c<W-1 && a(i+1)) out.push('br');
  if((r+1)%G.br===0 && r<G.H-1 && a(i+W)) out.push('bb');
  if(W > 16 || G.act.some(x=>!x)){
    if(c===0 || !a(i-1)) out.push('eL'); if(r===0 || !a(i-W)) out.push('eT');
    if(c===W-1 || !a(i+1)) out.push('eR'); if(r===G.H-1 || !a(i+W)) out.push('eB');
  }
  return out.join(' ');
}
function sudokuTableHtml(S, showMarks, nums = true){
  const G = sdGeom(S), W = G.W;
  let h = `<div class="sdPrevWrap"><table class="sdPrev${W>9?' big':''}${S.kind==='samurai'?' sam':''}">`;
  for(let r=0;r<G.H;r++){
    h += '<tr>';
    for(let c=0;c<W;c++){
      const i = r*W+c;
      if(!G.act[i]){ h += '<td class="v"></td>'; continue; }
      const ch = S.puz[i], mk = showMarks && S.marks.includes(i);
      h += `<td class="${sdCellCls(G,i)}${mk?' mark':''}">${(mk && nums) ? `<small>${S.marks.indexOf(i)+1}</small>` : ''}${ch==='.'?'':ch}</td>`;
    }
    h += '</tr>';
  }
  return h + '</table></div>';
}

/* ---------- Sudoku: Spielen ---------- */
function mountSudoku(el, d, onProgress){
  const S = d.sudoku, G = sdGeom(S), W = G.W, NN = W*G.H, big = W > 9;
  const key = 'advent_sd_' + YEAR + '_' + d.day;
  const given = S.puz.split('').map(ch=>ch!=='.');
  let vals = lsGetJSON(key, null);
  if(!Array.isArray(vals) || vals.length !== NN) vals = S.puz.split('').map(ch=>ch==='.'?'':ch);
  let sel = -1, showErr = false, clearArmed = false;
  const symbols = S.symbols.split('');
  const tipKey = 'advent_st_' + YEAR + '_' + d.day;
  const tipsMax = d.sdTips === undefined ? 3 : +d.sdTips;
  let tips = lsGetJSON(tipKey, []); if(!Array.isArray(tips)) tips = [];
  tips.forEach(i=> vals[i] = S.sol[i]);
  const fixed = i => given[i] || tips.includes(i);
  const tipsLeft = ()=> tipsMax < 0 ? Infinity : Math.max(0, tipsMax - tips.length);
  el.innerHTML = `<div class="sd${S.kind==='samurai'?' sam':''}">
    ${big ? '<div class="wgTools"><button type="button" class="pill zoomBtn" data-act="full">🔍 Vergrößern</button></div>' : ''}
    <div class="sdScroll"><div class="sdBoard" style="grid-template-columns:repeat(${W},1fr); grid-template-rows:repeat(${G.H},1fr); --sdW:${W}"></div></div>
    <div class="sdPad"></div>
    <div class="wgTools" style="margin-top:8px">
      ${tipsMax !== 0 ? '<button type="button" class="pill" data-act="tip"></button>' : ''}
      <button type="button" class="pill" data-act="err">👁 Fehler anzeigen</button>
      <button type="button" class="pill" data-act="clear">Alles löschen</button>
    </div>
    <p class="wgMsg"></p>
  </div>`;
  const board = el.querySelector('.sdBoard'), pad = el.querySelector('.sdPad'), msg = el.querySelector('.wgMsg');
  const HELP = 'Feld anklicken oder antippen, dann unten ' + (S.mode==='word' ? 'einen Buchstaben' : 'eine Zahl') + ' wählen. Am PC geht auch die Tastatur.';
  const scroller = el.querySelector('.sdScroll');
  const fit = ()=>{
    const box = el.querySelector('.sd');
    if(box && box.classList.contains('full')){
      /* Vollbild: ganzes Sudoku auf den Bildschirm einpassen (Breite UND Höhe), nur bei sehr kleinen Feldern scrollen */
      const avail = Math.min(scroller.clientWidth, scroller.clientHeight * W / G.H);
      const w = Math.floor(Math.max(avail, W * 16));
      if(board.style.width !== w + 'px') board.style.width = w + 'px';
    } else if(board.style.width) board.style.width = '';
    board.style.fontSize = Math.max(big ? 8 : 12, board.clientWidth / W * 0.5) + 'px';
  };
  try{ const ro = new ResizeObserver(fit); ro.observe(board); ro.observe(scroller); }catch(e){ window.addEventListener('resize', fit); }
  pad.innerHTML = symbols.map(s=>`<button type="button" data-s="${s}">${s}</button>`).join('') + `<button type="button" class="del" data-s="">⌫</button>`;
  const solved = ()=> vals.every((v,i)=> v === S.sol[i]);
  const draw = ()=>{
    const selVal = sel >= 0 ? vals[sel] : '';
    let h = '';
    for(let i=0;i<NN;i++){
      if(!G.act[i]){ h += '<div class="sdVoid"></div>'; continue; }
      const cls = ['sdCell', given[i]?'given':'', tips.includes(i)?'tip':'', sdCellCls(G, i),
        S.marks.includes(i)?'mark':'',
        (selVal && vals[i]===selVal && i!==sel)?'same':'',
        i===sel?'sel':'',
        (showErr && vals[i] && vals[i]!==S.sol[i])?'err':''].join(' ');
      const mk = (S.marks.includes(i) && d.sdNums !== false) ? `<span class="mk">${S.marks.indexOf(i)+1}</span>` : '';
      h += `<div class="${cls}" data-i="${i}">${mk}${vals[i]||''}</div>`;
    }
    board.innerHTML = h;
    fit();
    const tb = el.querySelector('[data-act="tip"]');
    if(tb){ const left = tipsLeft(); tb.disabled = left === 0 || solved(); tb.textContent = left === 0 ? '💡 Keine Feld-Tipps mehr' : left === Infinity ? '💡 Feld-Tipp' : `💡 Feld-Tipp (noch ${left})`; }
    const done = solved();
    if(done) msg.textContent = d.sdNums !== false
      ? (S.mode==='word' ? '🎉 Sudoku gelöst! Lies jetzt das Lösungswort in den farbigen Feldern, der Reihe nach (1, 2, 3 …).' : '🎉 Sudoku gelöst! Die Zahlen in den farbigen Feldern der Reihe nach (1, 2, 3 …) ergeben den Code.')
      : (S.mode==='word' ? (S.dir === 'cells' ? '🎉 Sudoku gelöst! Lies die Buchstaben in den farbigen Feldern Zeile für Zeile von oben nach unten, wie in einem Buch, dann hast du das Lösungswort.' : '🎉 Sudoku gelöst! Lies jetzt die Buchstaben in den farbigen Feldern entlang ihrer Linie, von links bzw. von oben, dann hast du das Lösungswort.') : '🎉 Sudoku gelöst! Lies die Zahlen in den farbigen Feldern Zeile für Zeile von oben nach unten, wie in einem Buch, dann hast du den Code.');
    else if(!msg.dataset.keep) msg.textContent = HELP;
    if(onProgress) onProgress(done);
  };
  const setVal = s => {
    if(sel < 0 || fixed(sel)) return;
    vals[sel] = s; lsSetJSON(key, vals); msg.dataset.keep = ''; draw();
  };
  board.addEventListener('click', e=>{
    const cell = e.target.closest('[data-i]'); if(!cell) return;
    sel = +cell.dataset.i; draw();
  });
  pad.addEventListener('click', e=>{ const b = e.target.closest('[data-s]'); if(b) setVal(b.dataset.s); });
  const onKey = e=>{
    if(!el.isConnected){ document.removeEventListener('keydown', onKey); return; }
    if(sel < 0 || !overlay.classList.contains('show')) return;
    if(e.target.closest && e.target.closest('input,textarea')) return;
    const k = e.key.toUpperCase();
    if(symbols.includes(k)){ setVal(k); e.preventDefault(); }
    else if(e.key==='Backspace' || e.key==='Delete'){ setVal(''); e.preventDefault(); }
    else if(e.key.startsWith('Arrow')){
      const [dr,dc] = {ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
      let r = Math.floor(sel/W), c = sel%W;
      for(let k=0;k<W;k++){ r = (r+dr+G.H)%G.H; c = (c+dc+W)%W; if(G.act[r*W+c]) break; }
      sel = r*W+c; draw(); e.preventDefault();
    }
  };
  document.addEventListener('keydown', onKey);
  el.querySelectorAll('[data-act]').forEach(b=> b.addEventListener('click', ()=>{
    if(b.dataset.act === 'tip'){
      if(tipsLeft() === 0 || solved()) return;
      let t = (sel >= 0 && !fixed(sel) && vals[sel] !== S.sol[sel]) ? sel : -1;
      if(t < 0){
        const open = G.cells.filter(i=> !fixed(i) && vals[i] !== S.sol[i]);
        const plain = open.filter(i=> !S.marks.includes(i));
        const pool = plain.length ? plain : open;
        t = pool[Math.floor(Math.random()*pool.length)];
      }
      if(t === undefined || t < 0) return;
      tips.push(t); lsSetJSON(tipKey, tips);
      vals[t] = S.sol[t]; lsSetJSON(key, vals); sel = t;
      msg.dataset.keep = '1';
      msg.textContent = `💡 Ein Feld wurde aufgedeckt (grün). ` + (tipsLeft() === Infinity ? '' : tipsLeft() ? `Noch ${tipsLeft()} Feld-Tipp(s).` : 'Das war der letzte Feld-Tipp.') + ' Tipp: Wähle vorher ein Feld aus, dann wird genau dieses aufgedeckt.';
      draw(); return;
    }
    if(b.dataset.act === 'full'){ const box = el.querySelector('.sd'), on = box.classList.toggle('full'); b.textContent = on ? '🔍 Verkleinern' : '🔍 Vergrößern'; document.body.style.overflow = on ? 'hidden' : ''; setTimeout(fit, 0); return; }
    if(b.dataset.act === 'err'){ showErr = !showErr; b.classList.toggle('on', showErr); b.textContent = showErr ? '👁 Fehler ausblenden' : '👁 Fehler anzeigen'; draw(); }
    if(b.dataset.act === 'clear'){
      if(!clearArmed){ clearArmed = true; b.textContent = 'Wirklich? Zum Bestätigen nochmal drücken'; return; }
      clearArmed = false; b.textContent = 'Alles löschen';
      vals = S.puz.split('').map(ch=>ch==='.'?'':ch); tips.forEach(i=> vals[i] = S.sol[i]); lsSetJSON(key, vals); draw();
    }
  }));
  draw();
}

/* ---------- Kreuzworträtsel: Generator ---------- */
function buildCrossword(entries, sol){
  const attempt = order => {
    const cells = new Map(); // "r,c" -> {ch, h:bool, v:bool}
    const placed = [];
    const get = (r,c) => cells.get(r+','+c);
    const canPlace = (w, r, c, dir) => {
      const [dr,dc] = dir==='h' ? [0,1] : [1,0];
      if(get(r-dr, c-dc) || get(r+dr*w.length, c+dc*w.length)) return -1;
      let cross = 0;
      for(let i=0;i<w.length;i++){
        const rr = r+dr*i, cc = c+dc*i, cell = get(rr,cc);
        if(cell){
          if(cell.ch !== w[i] || cell[dir]) return -1;
          cross++;
        } else {
          const [pr,pc] = dir==='h' ? [1,0] : [0,1];
          if(get(rr+pr, cc+pc) || get(rr-pr, cc-pc)) return -1;
        }
      }
      return cross;
    };
    const put = (e, r, c, dir) => {
      const [dr,dc] = dir==='h' ? [0,1] : [1,0];
      for(let i=0;i<e.w.length;i++){
        const k = (r+dr*i)+','+(c+dc*i);
        const cell = cells.get(k) || {ch:e.w[i], h:false, v:false};
        cell[dir] = true; cells.set(k, cell);
      }
      placed.push({w:e.w, clue:e.clue, r, c, dir});
    };
    let rest = order.slice();
    put(rest.shift(), 0, 0, 'h');
    for(let round=0; round<2; round++){
      const left = [];
      for(const e of rest){
        const opts = [];
        for(const [k, cell] of cells){
          const [r,c] = k.split(',').map(Number);
          for(let i=0;i<e.w.length;i++){
            if(e.w[i] !== cell.ch) continue;
            for(const dir of ['h','v']){
              if(cell[dir]) continue;
              const sr = dir==='h' ? r : r-i, sc = dir==='h' ? c-i : c;
              const x = canPlace(e.w, sr, sc, dir);
              if(x > 0) opts.push({sr, sc, dir, x});
            }
          }
        }
        if(opts.length){
          const maxX = Math.max(...opts.map(o=>o.x));
          const pick = shuffleArr(opts.filter(o=>o.x===maxX))[0];
          put(e, pick.sr, pick.sc, pick.dir);
        } else left.push(e);
      }
      rest = left;
    }
    let minR=1e9, minC=1e9, maxR=-1e9, maxC=-1e9;
    for(const k of cells.keys()){ const [r,c] = k.split(',').map(Number); minR=Math.min(minR,r); minC=Math.min(minC,c); maxR=Math.max(maxR,r); maxC=Math.max(maxC,c); }
    return { cells, placed, failed: rest.map(e=>e.w), minR, minC, h: maxR-minR+1, w: maxC-minC+1 };
  };
  let best = null;
  for(let t=0; t<60; t++){
    const order = t===0 ? entries.slice().sort((a,b)=>b.w.length-a.w.length) : [entries.slice().sort((a,b)=>b.w.length-a.w.length)[0], ...shuffleArr(entries.slice().sort((a,b)=>b.w.length-a.w.length).slice(1))];
    const res = attempt(order);
    const score = res.placed.length*1000 - Math.max(res.w, res.h)*10 - (res.w*res.h)/10;
    if(!best || score > best.score){ best = res; best.score = score; }
  }
  const {w, h, minR, minC} = best;
  const rows = [];
  for(let r=0;r<h;r++){ let s=''; for(let c=0;c<w;c++){ const cell = best.cells.get((r+minR)+','+(c+minC)); s += cell ? cell.ch : '#'; } rows.push(s); }
  const words = best.placed.map(p=>({ w:p.w, clue:p.clue, r:p.r-minR, c:p.c-minC, dir:p.dir }));
  const starts = [...new Set(words.map(x=>x.r*1000+x.c))].sort((a,b)=>a-b);
  words.forEach(x=> x.num = starts.indexOf(x.r*1000+x.c)+1);
  words.sort((a,b)=> a.num-b.num);
  let marks = [];
  if(sol){
    const used = new Set();
    for(const ch of sol){
      const opts = [];
      for(let r=0;r<h;r++) for(let c=0;c<w;c++) if(rows[r][c]===ch && !used.has(r*1000+c)) opts.push([r,c]);
      if(!opts.length) return { error: `Der Buchstabe ${ch} aus dem Lösungswort kommt in den Wörtern nicht (oft genug) vor. Anderes Lösungswort oder mehr Wörter nehmen.` };
      const pick = shuffleArr(opts)[0]; used.add(pick[0]*1000+pick[1]); marks.push(pick);
    }
  }
  return { w, h, rows, words: words.map(x=>({num:x.num, dir:x.dir, r:x.r, c:x.c, len:x.w.length, clue:x.clue})), marks, sol, failed: best.failed };
}
function crosswordPreviewHtml(C){
  let h = `<div class="cwPrev" style="grid-template-columns:repeat(${C.w},1fr)">`;
  for(let r=0;r<C.h;r++) for(let c=0;c<C.w;c++){
    const ch = C.rows[r][c];
    const mi = C.marks.findIndex(m=>m[0]===r && m[1]===c);
    h += ch==='#' ? '<div></div>' : `<div class="pc${mi>=0?' mark':''}">${ch}</div>`;
  }
  return h + '</div>';
}

/* ---------- Kreuzworträtsel: Spielen ---------- */
function mountCrossword(el, d, onProgress){
  const C = d.crossword, W = C.w, Hh = C.h;
  const key = 'advent_cw_' + YEAR + '_' + d.day;
  let vals = lsGetJSON(key, null);
  if(!Array.isArray(vals) || vals.length !== W*Hh) vals = new Array(W*Hh).fill('');
  const isCell = (r,c) => r>=0 && c>=0 && r<Hh && c<W && C.rows[r][c] !== '#';
  const numAt = {}; C.words.forEach(x=> numAt[x.r*W+x.c] = x.num);
  const wordsAt = i => C.words.filter(x=>{ const r=Math.floor(i/W), c=i%W; return x.dir==='h' ? (r===x.r && c>=x.c && c<x.c+x.len) : (c===x.c && r>=x.r && r<x.r+x.len); });
  const cellsOfWord = x => Array.from({length:x.len}, (_,k)=> x.dir==='h' ? x.r*W + x.c + k : (x.r+k)*W + x.c);
  let cur = -1, dir = 'h', clearArmed = false, checkOn = false;
  let h = `<div class="wg cw">
    <div class="wgTools">
      <button type="button" class="pill" data-act="check">✔ Prüfen</button>
      <button type="button" class="pill" data-act="clear">Alles löschen</button>
      <button type="button" class="pill zoomBtn" data-act="full">🔍 Vergrößern</button>
    </div>
    <p class="wgMsg">Kästchen anklicken oder antippen und Buchstaben eintippen. Nochmal auf dasselbe Kästchen: Richtung wechseln (waagerecht / senkrecht).</p>
    <div class="cwBoard" style="grid-template-columns:repeat(${W},1fr)">`;
  for(let r=0;r<Hh;r++) for(let c=0;c<W;c++){
    const i = r*W+c;
    if(!isCell(r,c)){ h += '<div class="cwBlock"></div>'; continue; }
    const mi = C.marks.findIndex(m=>m[0]===r && m[1]===c);
    h += `<div class="cwCell${mi>=0?' mark':''}" data-i="${i}">${numAt[i]?`<span class="num">${numAt[i]}</span>`:''}${mi>=0?`<span class="mk">${mi+1}</span>`:''}<input type="text" maxlength="2" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Kästchen" data-i="${i}"></div>`;
  }
  h += `</div>`;
  if(C.marks.length) h += `<div class="cwSolWrap"><b>Lösungswort:</b><div class="cwSol">${C.marks.map((m,k)=>`<span data-k="${k}"><small>${k+1}</small></span>`).join('')}</div></div>`;
  const clueList = dd => C.words.filter(x=>x.dir===dd).map(x=>`<li data-num="${x.num}" data-dir="${dd}"><b>${x.num}</b> ${esc(x.clue)} <span class="len">(${x.len})</span></li>`).join('');
  h += `<div class="cwClues"><div><h4>Waagerecht →</h4><ol>${clueList('h')}</ol></div><div><h4>Senkrecht ↓</h4><ol>${clueList('v')}</ol></div></div></div>`;
  el.innerHTML = h;
  const box = el.querySelector('.cw'), board = el.querySelector('.cwBoard'), msg = el.querySelector('.wgMsg');
  const inputs = {}; board.querySelectorAll('input').forEach(inp=>{ inputs[+inp.dataset.i] = inp; inp.value = vals[+inp.dataset.i] || ''; });
  const solved = ()=> Object.keys(inputs).every(i=> vals[i] === C.rows[Math.floor(i/W)][i%W]);
  const draw = ()=>{
    const act = cur >= 0 ? (wordsAt(cur).find(x=>x.dir===dir) || wordsAt(cur)[0]) : null;
    const actCells = act ? cellsOfWord(act) : [];
    board.querySelectorAll('.cwCell').forEach(cell=>{
      const i = +cell.dataset.i;
      cell.classList.toggle('act', actCells.includes(i));
      cell.classList.toggle('cur', i === cur);
      cell.classList.toggle('err', checkOn && !!vals[i] && vals[i] !== C.rows[Math.floor(i/W)][i%W]);
    });
    el.querySelectorAll('.cwClues li').forEach(li=> li.classList.toggle('act', !!act && +li.dataset.num===act.num && li.dataset.dir===act.dir));
    el.querySelectorAll('.cwSol span').forEach(s=>{ const m = C.marks[+s.dataset.k]; s.childNodes[1]?.remove(); s.append(vals[m[0]*W+m[1]] || ''); });
    const done = solved();
    if(done) msg.textContent = C.marks.length ? '🎉 Kreuzworträtsel gelöst! Das Lösungswort steht jetzt unter dem Gitter.' : '🎉 Kreuzworträtsel gelöst!';
    if(onProgress) onProgress(done);
  };
  const fit = ()=>{ const cs = board.clientWidth / W; board.style.setProperty('--cwf', Math.max(14, Math.min(26, cs*0.55)) + 'px'); };
  try{ new ResizeObserver(fit).observe(board); }catch(e){ window.addEventListener('resize', fit); }
  fit();
  const focusCell = i => { if(inputs[i]){ inputs[i].focus({preventScroll:true}); } };
  const step = (i, back) => {
    const r = Math.floor(i/W), c = i%W, s = back ? -1 : 1;
    const nr = dir==='v' ? r+s : r, nc = dir==='h' ? c+s : c;
    return isCell(nr,nc) ? nr*W+nc : -1;
  };
  board.addEventListener('pointerdown', e=>{
    const cell = e.target.closest('.cwCell'); if(!cell) return;
    const i = +cell.dataset.i;
    if(i === cur){ const ws = wordsAt(i); if(ws.length > 1) dir = dir==='h' ? 'v' : 'h'; }
    else { cur = i; const ws = wordsAt(i); if(!ws.some(x=>x.dir===dir) && ws.length) dir = ws[0].dir; }
    draw();
  });
  board.addEventListener('focusin', e=>{
    const i = +e.target.dataset.i; if(isNaN(i)) return;
    if(i !== cur){ cur = i; const ws = wordsAt(i); if(!ws.some(x=>x.dir===dir) && ws.length) dir = ws[0].dir; draw(); }
    const tgt = e.target; setTimeout(()=>{ try{ if(document.activeElement === tgt) tgt.select(); }catch(err){} }, 0);
  });
  board.addEventListener('input', e=>{
    const inp = e.target, i = +inp.dataset.i;
    let ch = (inp.value || '').toUpperCase().replace(/Ä/g,'A').replace(/Ö/g,'O').replace(/Ü/g,'U').replace(/ß/g,'S').replace(/[^A-Z]/g,'');
    ch = ch.slice(-1);
    inp.value = ch; vals[i] = ch; lsSetJSON(key, vals);
    checkOn = false;
    if(ch){ const nx = step(i, false); if(nx >= 0){ cur = nx; focusCell(nx); } }
    draw();
  });
  board.addEventListener('keydown', e=>{
    const i = +e.target.dataset.i; if(isNaN(i)) return;
    if(e.key === 'Backspace' && !e.target.value){ const pv = step(i, true); if(pv >= 0){ vals[pv] = ''; inputs[pv].value = ''; lsSetJSON(key, vals); cur = pv; focusCell(pv); draw(); } e.preventDefault(); }
    else if(e.key.startsWith('Arrow')){
      const [dr,dc] = {ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
      dir = dr ? 'v' : 'h';
      let r = Math.floor(i/W)+dr, c = i%W+dc;
      while(r>=0 && c>=0 && r<Hh && c<W && !isCell(r,c)){ r+=dr; c+=dc; }
      if(isCell(r,c)){ cur = r*W+c; focusCell(cur); }
      draw(); e.preventDefault();
    }
  });
  el.querySelectorAll('.cwClues li').forEach(li=> li.addEventListener('click', ()=>{
    const x = C.words.find(w=>w.num===+li.dataset.num && w.dir===li.dataset.dir);
    dir = x.dir; cur = x.r*W + x.c; focusCell(cur); draw();
  }));
  el.querySelectorAll('[data-act]').forEach(b=> b.addEventListener('click', ()=>{
    const act = b.dataset.act;
    if(act === 'check'){
      checkOn = true; draw();
      const wrong = Object.keys(inputs).filter(i=> vals[i] && vals[i] !== C.rows[Math.floor(i/W)][i%W]).length;
      const empty = Object.keys(inputs).filter(i=> !vals[i]).length;
      if(!solved()) msg.textContent = wrong ? `${wrong} Buchstabe(n) stimmen noch nicht (rot markiert).` + (empty ? ` ${empty} Kästchen sind noch leer.` : '') : `Bisher alles richtig! Noch ${empty} Kästchen leer.`;
    } else if(act === 'clear'){
      if(!clearArmed){ clearArmed = true; b.textContent = 'Wirklich? Zum Bestätigen nochmal drücken'; return; }
      clearArmed = false; b.textContent = 'Alles löschen';
      vals = new Array(W*Hh).fill(''); Object.values(inputs).forEach(inp=> inp.value = ''); lsSetJSON(key, vals); checkOn = false; draw();
    } else if(act === 'full'){
      const on = box.classList.toggle('full');
      b.textContent = on ? '🔍 Verkleinern' : '🔍 Vergrößern';
      document.body.style.overflow = on ? 'hidden' : '';
      setTimeout(fit, 0);
    }
    if(act !== 'clear' && clearArmed){ clearArmed = false; el.querySelector('[data-act="clear"]').textContent = 'Alles löschen'; }
  }));
  draw();
}

function mountQuiz(el, d, onSolved){

      const st = state[qi] || {wrong:[]};
      return `<div class="qzItem"><p class="qq">${Q.length>1?`${qi+1}. `:''}${esc(q.q)}</p><div class="qzOpts">${q.a.map((a,ai)=>{
        const cls = st.right && ai===q.c ? 'right' : (st.wrong||[]).includes(ai) ? 'wrong' : '';
        return `<button type="button" class="${cls}" data-q="${qi}" data-a="${ai}" ${st.right||cls?'disabled':''}>${String.fromCharCode(65+ai)}) ${esc(a)}</button>`;
      }).join('')}</div></div>`;
    }).join('')}<p class="wgMsg" id="qzMsg"></p></div>`;
    const nRight = Q.filter((_,qi)=>state[qi]?.right).length;
    const m = el.querySelector('#qzMsg');
    m.textContent = nRight === Q.length ? (Q.length>1 ? '🎉 Alle Fragen richtig beantwortet!' : '🎉 Richtig!') : (Q.length>1 ? `${nRight} von ${Q.length} Fragen richtig.` : 'Klicke oder tippe auf eine Antwort.');
    el.querySelectorAll('button[data-q]').forEach(b=> b.addEventListener('click', ()=>{

      state[qi] = st; lsSetJSON(key, state);
      draw();
      if(Q.every((_,k)=>state[k]?.right)) onSolved();
    }));
  };
  draw();
  if(Q.every((_,k)=>state[k]?.right)) onSolved();
}

/* ---------- Gemeinsame Hilfen für weitere Rätsel ---------- */
const ALPHA_DE = 'ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ'.split('');
function upDE(s){ return String(s||'').replace(/ß/g,'ẞ').toUpperCase().replace(/ẞ/g,'ß'); }
function cropSquare(file, size, quality, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const s = Math.min(img.width, img.height), cv = document.createElement('canvas');
      cv.width = cv.height = Math.min(size, s);
      cv.getContext('2d').drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function scrambleWord(w){
  if(new Set(w).size < 2) return w;
  let s = w;
  for(let t=0; t<30 && s===w; t++) s = shuffleArr(w.split('')).join('');
  return s;
}

/* ---------- Buchstabensalat ---------- */
function mountAnagram(el, d, onSolved){
  const A = d.anagram, key = 'advent_an_' + YEAR + '_' + d.day;
  let st = lsGetJSON(key, {});
  const draw = ()=>{
    el.innerHTML = `<div class="an">${A.map((x,i)=>{
      const s = st[i] || {b:[]}, done = !!s.done;
      const built = s.b.map(k=>x.s[k]).join('');
      return `<div class="anItem${done?' done':''}" data-i="${i}">
        ${x.hint ? `<p class="anHint">${A.length>1?`${i+1}. `:''}${esc(x.hint)}</p>` : (A.length>1?`<p class="anHint">${i+1}.</p>`:'')}
        <div class="anSlots">${x.w.split('').map((_,k)=>`<span class="anSlot${s.b[k]!==undefined?' full':''}" data-k="${k}">${built[k]||''}</span>`).join('')}</div>
        ${done ? `<p class="anOk">✓ ${esc(x.w)}</p>` : `<div class="anTiles">${x.s.split('').map((ch,k)=>`<button type="button" data-t="${k}" ${s.b.includes(k)?'disabled':''}>${esc(ch)}</button>`).join('')}</div>
        <div class="anBtns"><button type="button" class="pill" data-act="back">⌫ Zurück</button><button type="button" class="pill" data-act="reset">Leeren</button></div>
        ${s.b.length===x.w.length ? '<p class="feedback bad">Stimmt noch nicht. Tippe auf einen Buchstaben oben, um ihn zurückzulegen.</p>' : ''}`}
      </div>`;
    }).join('')}<p class="wgMsg" id="anMsg"></p></div>`;
    const nDone = A.filter((_,i)=>st[i]?.done).length;
    el.querySelector('#anMsg').textContent = nDone === A.length ? '🎉 Alle Wörter entwirrt!' : `Buchstaben in der richtigen Reihenfolge anklicken oder antippen. ${A.length>1 ? `${nDone} von ${A.length} gelöst.` : ''}`;
    el.querySelectorAll('.anItem').forEach(box=>{
      const i = +box.dataset.i, x = A[i];
      const s = st[i] = st[i] || {b:[]};
      const check = ()=>{ if(s.b.length === x.w.length && s.b.map(k=>x.s[k]).join('') === x.w){ s.done = true; } lsSetJSON(key, st); draw(); if(A.every((_,k)=>st[k]?.done)) onSolved(); };
      box.querySelectorAll('[data-t]').forEach(b=> b.addEventListener('click', ()=>{ if(s.b.length < x.w.length){ s.b.push(+b.dataset.t); check(); } }));
      box.querySelectorAll('.anSlot.full').forEach(sl=> sl.addEventListener('click', ()=>{ if(s.done) return; s.b.splice(+sl.dataset.k, 1); check(); }));
      box.querySelector('[data-act="back"]')?.addEventListener('click', ()=>{ s.b.pop(); check(); });
      box.querySelector('[data-act="reset"]')?.addEventListener('click', ()=>{ s.b = []; check(); });
    });
  };
  draw();
  if(A.every((_,k)=>st[k]?.done)) onSolved();
}

/* ---------- Wörter raten (Galgenmännchen) ---------- */
function mountHangman(el, d, onSolved){
  const H = d.hangman, word = upDE(H.word), lives = H.lives || 8;
  const key = 'advent_hm_' + YEAR + '_' + d.day;
  let st = lsGetJSON(key, {g:[]});
  const isLetter = ch => ALPHA_DE.includes(ch) || ch === 'ß';
  const need = [...new Set(word.split('').filter(isLetter))];
  const draw = ()=>{
    const wrong = st.g.filter(ch=>!need.includes(ch)).length;
    const won = need.every(ch=>st.g.includes(ch)), lost = !won && wrong >= lives;
    el.innerHTML = `<div class="hm">
      ${H.hint ? `<p class="anHint">💡 ${esc(H.hint)}</p>` : ''}
      <div class="hmWord">${word.split(/\s+/).filter(Boolean).map(wd=>`<span class="hmW">${wd.split('').map(ch=> isLetter(ch) ? `<span class="hmL">${(st.g.includes(ch)||lost) ? ch : ''}</span>` : `<span class="hmX">${esc(ch)}</span>`).join('')}</span>`).join('')}</div>
      <p class="hmInfo">${word.split(/\s+/).filter(Boolean).length > 1 ? `${word.split(/\s+/).filter(Boolean).length} Wörter: ` + word.split(/\s+/).filter(Boolean).map(w=>w.split('').filter(isLetter).length).join(' + ') + ' Buchstaben' : `1 Wort mit ${need.length ? word.split('').filter(isLetter).length : 0} Buchstaben`}</p>
      <p class="hmLives" aria-label="Noch ${lives-wrong} Fehlversuche">${'🕯️'.repeat(Math.max(0,lives-wrong))}<span class="out">${'🕯️'.repeat(Math.min(lives,wrong))}</span></p>
      <p class="wgMsg">${won ? '🎉 Richtig geraten!' : lost ? 'Alle Kerzen sind aus. Das Wort ist oben zu sehen.' : `Noch ${lives-wrong} Fehlversuche. Buchstaben anklicken oder auf der Tastatur tippen.`}</p>
      ${lost ? '<button type="button" class="pill primary" data-act="again">Nochmal versuchen</button>' : ''}
      ${won||lost ? '' : `<div class="hmKeys">${[...ALPHA_DE,'ß'].map(ch=>`<button type="button" data-k="${ch}" class="${st.g.includes(ch)?(need.includes(ch)?'right':'wrong'):''}" ${st.g.includes(ch)?'disabled':''}>${ch}</button>`).join('')}</div>`}
    </div>`;
    el.querySelectorAll('[data-k]').forEach(b=> b.addEventListener('click', ()=> guess(b.dataset.k)));
    el.querySelector('[data-act="again"]')?.addEventListener('click', ()=>{ st = {g:[]}; lsSetJSON(key, st); draw(); });
    if(won) onSolved();
  };
  const guess = ch => {
    if(st.g.includes(ch)) return;
    const wrong = st.g.filter(c=>!need.includes(c)).length;
    if(need.every(c=>st.g.includes(c)) || wrong >= lives) return;
    st.g.push(ch); lsSetJSON(key, st); draw();
  };
  const onKey = e=>{
    if(!el.isConnected){ document.removeEventListener('keydown', onKey); return; }
    if(!overlay.classList.contains('show') || (e.target.closest && e.target.closest('input,textarea'))) return;
    const k = upDE(e.key);
    if(k.length === 1 && (ALPHA_DE.includes(k) || k === 'ß')){ guess(k); e.preventDefault(); }
  };
  document.addEventListener('keydown', onKey);
  draw();
}

/* ---------- Lückentext ---------- */
function clozeParts(text){
  const parts = []; let last = 0; const re = /\[([^\]]+)\]/g; let m;
  while((m = re.exec(text))){ parts.push({t:text.slice(last, m.index)}); parts.push({gap:m[1].split('|').map(s=>s.trim()).filter(Boolean)}); last = re.lastIndex; }
  parts.push({t:text.slice(last)});
  return parts;
}
function mountCloze(el, d, onSolved){
  const Z = d.cloze, parts = clozeParts(Z.text);
  const gaps = parts.filter(p=>p.gap);
  const key = 'advent_cz_' + YEAR + '_' + d.day;
  let st = lsGetJSON(key, {v:[], done:false});
  let gi = 0;
  const html = parts.map(p=>{
    if(!p.gap) return esc(p.t);
    const i = gi++, len = Math.max(...p.gap.map(g=>g.length));
    return `<input type="text" class="czGap" data-g="${i}" style="width:${Math.max(3, len+1)}ch" autocomplete="off" spellcheck="false" aria-label="Lücke ${i+1}">`;
  }).join('');
  const bank = Z.bank ? shuffleArr(gaps.map(g=>g.gap[0])) : [];
  el.innerHTML = `<div class="cz">
    ${bank.length ? `<div class="czBank"><span>Diese Wörter fehlen:</span> ${bank.map(w=>`<b>${esc(w)}</b>`).join(' ')}</div>` : ''}
    <div class="czText">${html}</div>
    <div class="actions"><button type="button" class="pill primary" data-act="check">✔ Prüfen</button></div>
    <p class="wgMsg"></p></div>`;
  const inputs = [...el.querySelectorAll('.czGap')], msg = el.querySelector('.wgMsg');
  inputs.forEach((inp,i)=>{ inp.value = st.v[i] || ''; inp.addEventListener('input', ()=>{ st.v[i] = inp.value; inp.classList.remove('right','wrong'); lsSetJSON(key, st); }); });
  const check = silent=>{
    let ok = 0;
    inputs.forEach((inp,i)=>{
      const right = gaps[i].gap.map(norm).includes(norm(inp.value));
      if(right) ok++;
      if(!silent || right){ inp.classList.toggle('right', right); inp.classList.toggle('wrong', !right && !silent); }
    });
    if(ok === gaps.length){ msg.textContent = '🎉 Alle Lücken richtig!'; inputs.forEach(i=>i.readOnly = true); st.done = true; lsSetJSON(key, st); onSolved(); }
    else if(!silent) msg.textContent = `${ok} von ${gaps.length} Lücken richtig. Die roten nochmal ansehen.`;
  };
  el.querySelector('[data-act="check"]').addEventListener('click', ()=> check(false));
  msg.textContent = 'Fülle die Lücken aus und drücke dann auf „Prüfen“.';
  if(st.done) check(true);
}

/* ---------- Wer bin ich? ---------- */
function mountWhoAmI(el, d){

  let n = Math.max(1, Math.min(W.length, lsGetJSON(key, 1)));
  const draw = ()=>{
    const all = isSolved(d.day) || isRevealed(d.day);
    const shown = all ? W.length : n;
    el.innerHTML = `<div class="wa"><ol class="waList">${W.slice(0, shown).map((c,i)=>`<li><span>Hinweis ${i+1}</span>${esc(c)}</li>`).join('')}</ol>
      ${shown < W.length ? `<button type="button" class="pill" data-act="more">🔎 Nächster Hinweis (${shown+1} von ${W.length})</button>` : ''}
      <p class="wgMsg">${shown < W.length ? 'Je weniger Hinweise du brauchst, desto besser!' : ''}</p></div>`;
    el.querySelector('[data-act="more"]')?.addEventListener('click', ()=>{ n++; lsSetJSON(key, n); draw(); });

}

/* ---------- Zuordnen ---------- */
function mountMatch(el, d, onSolved){
  const P = d.match, key = 'advent_mt_' + YEAR + '_' + d.day;
  let st = lsGetJSON(key, null);
  if(!st || !Array.isArray(st.perm) || st.perm.length !== P.length) st = {perm: shuffleArr([...P.keys()]), m:[]};
  let selL = -1, selR = -1;
  const draw = (flash)=>{
    el.innerHTML = `<div class="mt"><div class="mtCols">
      <div class="mtCol">${P.map((p,i)=>`<button type="button" class="mtItem${st.m.includes(i)?' done':''}${selL===i?' sel':''}${flash&&flash[0]===i?' bad':''}" data-l="${i}" ${st.m.includes(i)?'disabled':''}>${st.m.includes(i)?`<b>${st.m.indexOf(i)+1}</b> `:''}${esc(p[0])}</button>`).join('')}</div>
      <div class="mtCol">${st.perm.map(i=>`<button type="button" class="mtItem${st.m.includes(i)?' done':''}${selR===i?' sel':''}${flash&&flash[1]===i?' bad':''}" data-r="${i}" ${st.m.includes(i)?'disabled':''}>${st.m.includes(i)?`<b>${st.m.indexOf(i)+1}</b> `:''}${esc(p2(i))}</button>`).join('')}</div>
    </div><p class="wgMsg">${st.m.length===P.length ? '🎉 Alles richtig zugeordnet!' : 'Erst links, dann rechts das passende Gegenstück anklicken oder antippen.'}</p></div>`;
    el.querySelectorAll('[data-l]').forEach(b=> b.addEventListener('click', ()=>{ selL = +b.dataset.l; tryMatch(); }));
    el.querySelectorAll('[data-r]').forEach(b=> b.addEventListener('click', ()=>{ selR = +b.dataset.r; tryMatch(); }));
  };
  const p2 = i => P[i][1];
  const tryMatch = ()=>{
    if(selL < 0 || selR < 0){ draw(); return; }
    if(selL === selR){ st.m.push(selL); lsSetJSON(key, st); selL = selR = -1; draw(); if(st.m.length === P.length) onSolved(); }
    else { const f = [selL, selR]; selL = selR = -1; draw(f); setTimeout(()=>{ if(el.isConnected) draw(); }, 700); }
  };
  lsSetJSON(key, st);
  draw();
  if(st.m.length === P.length) onSolved();
}

/* ---------- Zahlenschloss ---------- */
function mountLock(el, d, onSolved){
  const code = String(d.lock.code), n = code.length;
  const tries = +d.lock.tries || 0, wait = d.lock.wait === undefined ? 5 : +d.lock.wait;
  const key = 'advent_lk_' + YEAR + '_' + d.day;
  let st = lsGetJSON(key, null);
  if(Array.isArray(st)) st = {d:st, used:0, until:0};
  if(!st || !Array.isArray(st.d) || st.d.length !== n) st = {d:new Array(n).fill(0), used:0, until:0};
  const save = ()=> lsSetJSON(key, st);
  let timer = null;
  const fmt = ms => { const m = Math.max(1, Math.ceil(ms/60000)); if(m >= 60){ const h = Math.round(m/60); return h === 1 ? '1 Stunde' : `${h} Stunden`; } return m === 1 ? '1 Minute' : `${m} Minuten`; };
  const draw = (state)=>{
    if(tries && st.used >= tries && wait > 0 && Date.now() >= st.until){ st.used = 0; st.until = 0; save(); }
    const open = isSolved(d.day) || state === 'open';
    const blocked = !open && tries && st.used >= tries;
    const left = tries ? tries - st.used : 0;
    let msg;
    if(open) msg = '🎉 Das Schloss ist offen!';
    else if(blocked) msg = wait > 0 ? `⛔ Alle Versuche verbraucht. Neue Versuche in ${fmt(st.until - Date.now())}.` : '⛔ Alle Versuche verbraucht. Das Schloss bleibt zu.';
    else msg = (state==='bad' ? 'Falscher Code. ' : 'Stell den Code mit ▲ und ▼ ein. ') + (tries ? `Noch ${left} ${left===1?'Versuch':'Versuche'}.` : '');
    el.innerHTML = `<div class="lk${open?' open':''}${blocked?' blocked':''}${state==='bad'?' shake':''}">
      <div class="lkIcon">${open ? '🔓' : '🔒'}</div>
      ${tries && !open ? `<div class="lkTries" aria-label="Versuche">${'●'.repeat(Math.max(0,left))}<span>${'●'.repeat(Math.min(tries, st.used))}</span></div>` : ''}
      <div class="lkWheels">${(open ? code.split('').map(Number) : st.d).map((v,i)=>`<div class="lkWheel"><button type="button" data-i="${i}" data-d="1" aria-label="Ziffer ${i+1} hoch" ${open||blocked?'disabled':''}>▲</button><span>${v}</span><button type="button" data-i="${i}" data-d="-1" aria-label="Ziffer ${i+1} runter" ${open||blocked?'disabled':''}>▼</button></div>`).join('')}</div>
      ${open || blocked ? '' : '<button type="button" class="pill primary" data-act="try">Schloss öffnen</button>'}
      <p class="wgMsg">${msg}</p>
    </div>`;
    el.querySelectorAll('[data-d]').forEach(b=> b.addEventListener('click', ()=>{ const i = +b.dataset.i; st.d[i] = (st.d[i] + +b.dataset.d + 10) % 10; save(); draw(); }));
    el.querySelector('[data-act="try"]')?.addEventListener('click', ()=>{
      if(st.d.join('') === code){ draw('open'); onSolved(); return; }
      st.used++;
      if(tries && st.used >= tries && wait > 0) st.until = Date.now() + wait*60000;
      save(); draw('bad');
    });
    clearTimeout(timer);
    if(blocked && wait > 0) timer = setTimeout(()=>{ if(el.isConnected) draw(); }, Math.min(30000, Math.max(1000, st.until - Date.now())));
  };
  draw();
}

/* ---------- Labyrinth ---------- */
function buildMaze(n, word, decoys){
  const N = n*n, right = new Array(N).fill(1), down = new Array(N).fill(1), seen = new Array(N).fill(false);
  const stack = [0]; seen[0] = true;
  while(stack.length){
    const c = stack[stack.length-1], r = Math.floor(c/n), k = c%n, nb = [];
    if(r>0 && !seen[c-n]) nb.push(c-n); if(r<n-1 && !seen[c+n]) nb.push(c+n);
    if(k>0 && !seen[c-1]) nb.push(c-1); if(k<n-1 && !seen[c+1]) nb.push(c+1);
    if(!nb.length){ stack.pop(); continue; }
    const x = nb[Math.floor(Math.random()*nb.length)];
    if(x === c+1) right[c] = 0; else if(x === c-1) right[x] = 0; else if(x === c+n) down[c] = 0; else down[x] = 0;
    seen[x] = true; stack.push(x);
  }
  const prev = new Array(N).fill(-1), q = [0], vis = new Array(N).fill(false); vis[0] = true;
  const nbOpen = c => { const r = Math.floor(c/n), k = c%n, o = [];
    if(k<n-1 && !right[c]) o.push(c+1); if(k>0 && !right[c-1]) o.push(c-1);
    if(r<n-1 && !down[c]) o.push(c+n); if(r>0 && !down[c-n]) o.push(c-n); return o; };
  while(q.length){ const c = q.shift(); for(const x of nbOpen(c)) if(!vis[x]){ vis[x] = true; prev[x] = c; q.push(x); } }
  const path = []; for(let c = N-1; c !== -1; c = prev[c]) path.unshift(c);
  const letters = {};
  if(word){
    if(word.length > path.length - 2) return {error:`Das Wort ist zu lang für dieses Labyrinth (höchstens ${path.length-2} Buchstaben). Größeres Labyrinth wählen.`};
    const step = (path.length - 1) / (word.length + 1);
    for(let i=0;i<word.length;i++) letters[path[Math.round(step*(i+1))]] = word[i];
    if(decoys){
      const off = shuffleArr([...Array(N).keys()].filter(c=>!path.includes(c)));
      const pool = (word + 'AEINRST').split('');
      off.slice(0, Math.min(off.length, word.length + 2)).forEach(c=> letters[c] = pool[Math.floor(Math.random()*pool.length)]);
    }
  }
  return { n, right: right.join(''), down: down.join(''), letters, word: word||'', pathLen: path.length };
}
function mazeSvg(M, pathCells){
  const n = M.n; let s = `<svg viewBox="-0.1 -0.1 ${n+0.2} ${n+0.2}" class="mzSvg" aria-label="Labyrinth">`;
  s += `<rect x="0" y="0" width="${n}" height="${n}" fill="#fff"/>`;
  s += `<rect x="0" y="0" width="1" height="1" fill="#c8e6c9"/><rect x="${n-1}" y="${n-1}" width="1" height="1" fill="#ffe0b2"/>`;
  if(pathCells && pathCells.length > 1) s += `<polyline points="${pathCells.map(c=>`${c%n+.5},${Math.floor(c/n)+.5}`).join(' ')}" fill="none" stroke="#1976d2" stroke-width=".32" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>`;
  else if(pathCells && pathCells.length === 1) s += `<circle cx=".5" cy=".5" r=".2" fill="#1976d2" opacity=".6"/>`;
  for(const [c,ch] of Object.entries(M.letters)){ const x = c%n, y = Math.floor(c/n); s += `<text x="${x+.5}" y="${y+.68}" text-anchor="middle" font-size=".55" font-weight="bold" font-family="Courier New, monospace" fill="#8a4b00">${ch}</text>`; }
  s += `<text x=".5" y=".42" text-anchor="middle" font-size=".26" fill="#2e7d32" font-family="Georgia, serif">Start</text><text x="${n-.5}" y="${n-.38}" text-anchor="middle" font-size=".42">🏁</text>`;
  let w = '';
  for(let c=0;c<n*n;c++){ const x = c%n, y = Math.floor(c/n);
    if(x<n-1 && M.right[c]==='1') w += `M${x+1} ${y}V${y+1}`;
    if(y<n-1 && M.down[c]==='1') w += `M${x} ${y+1}H${x+1}`; }
  s += `<path d="${w}M0 0H${n}V${n}H0Z" stroke="#3b2a14" stroke-width=".09" stroke-linecap="square" fill="none"/>`;
  return s + '</svg>';
}
function mountMaze(el, d, onProgress){
  const M = d.maze, n = M.n, key = 'advent_mz_' + YEAR + '_' + d.day;
  let path = lsGetJSON(key, []);
  if(!Array.isArray(path)) path = [];
  const open = (a,b) => { if(b === a+1 && a%n < n-1) return M.right[a]==='0'; if(b === a-1 && b%n < n-1) return M.right[b]==='0'; if(b === a+n) return M.down[a]==='0'; if(b === a-n) return M.down[b]==='0'; return false; };
  el.innerHTML = `<div class="wg mz"><div class="wgTools">
      <button type="button" class="pill" data-act="reset">Neu beginnen</button>
      <button type="button" class="pill zoomBtn" data-act="full">🔍 Vergrößern</button></div>
    <p class="wgMsg"></p><div class="mzBoard"></div><p class="mzGot"></p></div>`;
  const box = el.querySelector('.mz'), board = el.querySelector('.mzBoard'), msg = el.querySelector('.wgMsg'), got = el.querySelector('.mzGot');
  const draw = ()=>{
    board.innerHTML = mazeSvg(M, path);
    const letters = path.map(c=>M.letters[c]).filter(Boolean);
    got.innerHTML = Object.keys(M.letters).length ? `Eingesammelte Buchstaben: <b>${letters.join(' ') || '–'}</b>` : '';
    const done = path[path.length-1] === n*n-1;
    msg.textContent = done ? (M.word ? '🏁 Ziel erreicht! Die eingesammelten Buchstaben ergeben das Lösungswort.' : '🏁 Ziel erreicht!')
      : path.length ? 'Weiter so! Zurück geht es, indem du den Weg zurückfährst.' : 'Beim grünen Start beginnen und mit Maus oder Finger den Weg zur Flagge ziehen. Oder Feld für Feld antippen.';
    if(onProgress) onProgress(done);
  };
  const cellAt = e => { const svg = board.querySelector('svg'), rc = svg.getBoundingClientRect(); const sc = (n+0.2)/rc.width;
    const x = Math.floor((e.clientX-rc.left)*sc - 0.1), y = Math.floor((e.clientY-rc.top)*sc - 0.1);
    return (x<0||y<0||x>=n||y>=n) ? -1 : y*n+x; };
  let dragging = false;
  const visit = c => {
    if(c < 0) return false;
    if(!path.length){ if(c === 0){ path = [0]; return true; } return false; }
    const last = path[path.length-1];
    if(c === last) return false;
    if(path.length > 1 && c === path[path.length-2]){ path.pop(); return true; }
    const idx = path.indexOf(c);
    if(idx >= 0){ path = path.slice(0, idx+1); return true; }
    if(open(last, c)){ path.push(c); return true; }
    return false;
  };
  board.addEventListener('pointerdown', e=>{ e.preventDefault(); dragging = true; try{ board.setPointerCapture(e.pointerId); }catch(err){} if(visit(cellAt(e))){ lsSetJSON(key, path); draw(); } });
  board.addEventListener('pointermove', e=>{ if(dragging && visit(cellAt(e))){ lsSetJSON(key, path); draw(); } });
  board.addEventListener('pointerup', ()=> dragging = false);
  board.addEventListener('pointercancel', ()=> dragging = false);
  el.querySelector('[data-act="reset"]').addEventListener('click', ()=>{ path = []; lsSetJSON(key, path); draw(); });
  el.querySelector('[data-act="full"]').addEventListener('click', e=>{ const on = box.classList.toggle('full'); e.target.textContent = on ? '🔍 Verkleinern' : '🔍 Vergrößern'; document.body.style.overflow = on ? 'hidden' : ''; });
  draw();
}

/* ---------- Bild-Puzzle ---------- */
function pzDims(P){
  const ar = +P.ar || 1, n = +P.n || 4;
  return ar >= 1 ? { cols: Math.max(n, Math.round(n*ar)), rows: n } : { cols: n, rows: Math.max(n, Math.round(n/ar)) };
}
function mountPuzzle(el, d, onSolved){
  const Pz = d.puzzle, { cols:C, rows:R } = pzDims(Pz), N = C*R, key = 'advent_pz_' + YEAR + '_' + d.day;
  let order = lsGetJSON(key, null);
  if(!Array.isArray(order) || order.length !== N){
    do { order = shuffleArr([...Array(N).keys()]); } while(order.every((v,i)=>v===i));
    lsSetJSON(key, order);
  }
  let sel = -1, peek = false, note = '', full = false;
  const solved = ()=> order.every((v,i)=>v===i);
  /* Passt das Teil rechts / unten wirklich an dieses Teil? */
  const fitR = i => { const t = order[i]; return i%C < C-1 && t%C < C-1 && order[i+1] === t+1; };
  const fitD = i => { const t = order[i]; return i+C < N && t+C < N && order[i+C] === t+C; };
  const groupOf = i => {
    const g = new Set([i]), st = [i];
    while(st.length){ const p = st.pop();
      const nb = [];
      if(fitR(p)) nb.push(p+1); if(p%C > 0 && fitR(p-1)) nb.push(p-1);
      if(fitD(p)) nb.push(p+C); if(p-C >= 0 && fitD(p-C)) nb.push(p-C);
      nb.forEach(q=>{ if(!g.has(q)){ g.add(q); st.push(q); } }); }
    return g;
  };
  const move = (a, b) => {
    const G = groupOf(a), dr = Math.floor(b/C) - Math.floor(a/C), dc = b%C - a%C;
    const map = new Map();
    for(const p of G){ const r = Math.floor(p/C)+dr, c = p%C+dc; if(r<0 || r>=R || c<0 || c>=C) return false; map.set(p, r*C+c); }
    const target = new Set(map.values());
    const displaced = [...target].filter(q=> !G.has(q)).sort((x,y)=>x-y);
    const vacated = [...G].filter(p=> !target.has(p)).sort((x,y)=>x-y);
    const next = order.slice();
    map.forEach((np, p)=>{ next[np] = order[p]; });
    displaced.forEach((q,k)=>{ next[vacated[k]] = order[q]; });
    order = next; lsSetJSON(key, order); return true;
  };
  const draw = ()=>{
    const done = solved(), selG = sel >= 0 ? groupOf(sel) : new Set();
    el.innerHTML = `<div class="pz${full?' full':''}">
      <div class="wgTools"><button type="button" class="pill zoomBtn" data-act="full">${full ? '🔍 Verkleinern' : '🔍 Vergrößern'}</button></div>
      <div class="pzBoard${done?' done':''}" style="grid-template-columns:repeat(${C},1fr); grid-template-rows:repeat(${R},1fr); aspect-ratio:${+Pz.ar||1} / 1; --ar:${+Pz.ar||1}">${order.map((t,i)=>{
        const r = Math.floor(t/C), c = t%C;
        const fR = fitR(i), fL = i%C > 0 && fitR(i-1), fD = fitD(i), fU = i-C >= 0 && fitD(i-C);
        const E = '#3b2a14', sh = done ? 'none' : [fR?'':`inset -1px 0 0 ${E}`, fL?'':`inset 1px 0 0 ${E}`, fD?'':`inset 0 -1px 0 ${E}`, fU?'':`inset 0 1px 0 ${E}`].filter(Boolean).join(',') || 'none';
        return `<button type="button" class="pzTile${selG.has(i)?' sel':''}" data-i="${i}" ${done?'disabled':''} aria-label="Puzzleteil" style="box-shadow:${sh}; background-image:url('${Pz.img}'); background-size:${C*100}% ${R*100}%; background-position:${C>1?c*100/(C-1):0}% ${R>1?r*100/(R-1):0}%"></button>`;
      }).join('')}</div>
      ${peek ? `<img src="${Pz.img}" alt="Vorlage" class="pzPeek">` : ''}
      <div class="wgTools" style="margin-top:8px">${done ? '' : `<button type="button" class="pill" data-act="peek">${peek ? '🖼 Vorlage ausblenden' : '🖼 Vorlage zeigen'}</button>`}</div>
      <p class="wgMsg">${done ? '🎉 Das Bild ist fertig!' : note || (sel >= 0
        ? (selG.size > 1 ? `Block mit ${selG.size} Teilen ausgewählt. Jetzt das Feld antippen, wohin das angetippte Teil soll – der ganze Block wandert mit.` : 'Jetzt das Feld antippen, wohin das Teil soll.')
        : 'Teil mit der Maus oder dem Finger anfassen, ziehen und dort loslassen, wo es hin soll. Passende Teile verschmelzen zu Blöcken, die du als Ganzes ziehen kannst. Verdrängte Teile rutschen auf die frei gewordenen Plätze. (Antippen und dann Zielfeld antippen geht auch.)')}</p></div>`;
    note = '';
    const tap = i => {
      if(sel < 0){ sel = i; draw(); return; }
      if(groupOf(sel).has(i)){ sel = -1; draw(); return; }
      if(!move(sel, i)) note = '⚠️ Der Block passt dort nicht hin, er würde über den Rand ragen. Wähle ein anderes Zielfeld.';
      else sel = -1;
      draw();
      if(solved()){ celebrate(d, 'puzzle'); onSolved(); }
    };
    /* Ziehen mit Maus oder Finger */
    const board = el.querySelector('.pzBoard');
    let drag = null;
    const marks = [];
    const clearMarks = ()=>{ marks.forEach(t=> t.classList.remove('drop','bad')); marks.length = 0; };
    const targetOf = d => {
      const dr = Math.round(d.dy / d.ch), dc = Math.round(d.dx / d.cw);
      const cells = []; let ok = true;
      for(const p of d.G){ const r = Math.floor(p/C)+dr, c = p%C+dc; if(r<0 || r>=R || c<0 || c>=C) ok = false; else cells.push(r*C+c); }
      return {dr, dc, ok, cells};
    };
    board.addEventListener('pointerdown', e=>{
      const t = e.target.closest('.pzTile'); if(!t || done) return;
      e.preventDefault();
      const rc = board.getBoundingClientRect(), i = +t.dataset.i, G = groupOf(i);
      drag = {i, G, x:e.clientX, y:e.clientY, dx:0, dy:0, cw:rc.width/C, ch:rc.height/R, moved:false, tiles:[...G].map(p=> board.children[p])};
      try{ board.setPointerCapture(e.pointerId); }catch(err){}
    });
    board.addEventListener('pointermove', e=>{
      if(!drag) return;
      drag.dx = e.clientX - drag.x; drag.dy = e.clientY - drag.y;
      if(!drag.moved && Math.hypot(drag.dx, drag.dy) < 6) return;
      drag.moved = true;
      drag.tiles.forEach(t=>{ t.classList.add('drag'); t.style.transform = `translate(${drag.dx}px, ${drag.dy}px)`; });
      clearMarks();
      const tg = targetOf(drag);
      if(tg.dr || tg.dc) tg.cells.forEach(q=>{ const t = board.children[q]; if(t && !drag.tiles.includes(t)){ t.classList.add(tg.ok ? 'drop' : 'bad'); marks.push(t); } });
    });
    const endDrag = cancel => {
      if(!drag) return;
      const d = drag; drag = null; clearMarks();
      if(cancel){ draw(); return; }
      if(!d.moved){ tap(d.i); return; }
      const tg = targetOf(d);
      if(tg.dr || tg.dc){
        if(!tg.ok) note = '⚠️ Der Block passt dort nicht hin, er würde über den Rand ragen.';
        else move(d.i, d.i + tg.dr*C + tg.dc);
      }
      sel = -1; draw();
      if(solved()){ celebrate(d, 'puzzle'); onSolved(); }
    };
    board.addEventListener('pointerup', ()=> endDrag(false));
    board.addEventListener('pointercancel', ()=> endDrag(true));
    el.querySelector('[data-act="peek"]')?.addEventListener('click', ()=>{ peek = !peek; draw(); });
    el.querySelector('[data-act="full"]').addEventListener('click', ()=>{ full = !full; document.body.style.overflow = full ? 'hidden' : ''; draw(); });
  };
  draw();
  if(solved()) onSolved();
}

/* ---------- Memory ---------- */
function mmCards(M){
  const cards = [];
  (M.pairs||[]).forEach((p,i)=>{ const twin = !!(p.b && (p.b.t || p.b.img)); cards.push({p:i, s:'a'}, {p:i, s: twin ? 'b' : 'a'}); });
  return cards;
}
function mmFaceHtml(c){
  c = c || {};
  const t = String(c.t||'').trim(), L = t.length;
  const fs = L <= 4 ? 22 : L <= 8 ? 17 : L <= 14 ? 14 : 12;
  if(c.img) return `<div class="mmFace mmFront" style="background-image:url('${c.img}')">${t ? `<span class="mmCap">${esc(t)}</span>` : ''}</div>`;
  return `<div class="mmFace mmFront"><span style="font-size:${fs}px">${esc(t)}</span></div>`;
}
function mmCols(n){ return n <= 12 ? 4 : n <= 20 ? 5 : 6; }
function mountMemory(el, d, onSolved){
  const M = d.memory, cards = mmCards(M), N = cards.length, P = (M.pairs||[]).length;
  const key = 'advent_mm_' + YEAR + '_' + d.day;
  let st = lsGetJSON(key, null);
  const fresh = ()=> ({ order: shuffleArr([...Array(N).keys()]), found: [], moves: 0 });
  if(!st || !Array.isArray(st.order) || st.order.length !== N) st = fresh();
  const save = ()=> lsSetJSON(key, st);
  save();
  let open = [], busy = false, full = false;
  const cols = mmCols(N), rows = Math.ceil(N / cols);
  const done = ()=> st.found.length >= P;
  const draw = ()=>{
    const fin = done();
    el.innerHTML = `<div class="mm${full?' full':''}">
      <div class="wgTools"><span class="mmStat">Paare: <b>${st.found.length}/${P}</b> · Züge: <b>${st.moves}</b></span><button type="button" class="pill zoomBtn" data-act="full">${full ? '🔍 Verkleinern' : '🔍 Vergrößern'}</button></div>
      <div class="mmGrid" style="grid-template-columns:repeat(${cols},1fr); --mmw:${(cols/rows*0.75).toFixed(3)}">${st.order.map((ci,pos)=>{
        const c = cards[ci], f = st.found.includes(c.p), o = open.includes(pos);
        const face = M.pairs[c.p][c.s];
        return `<button type="button" class="mmCard${f?' found':''}${o?' open':''}" data-pos="${pos}" aria-label="${f||o ? 'Karte: ' + esc(face.t||'Bild') : 'Verdeckte Karte'}"><div class="mmIn"><div class="mmFace mmBack">${esc(M.back || '🎄')}</div>${mmFaceHtml(face)}</div></button>`;
      }).join('')}</div>
      <p class="wgMsg">${fin ? `🎉 Alle Paare gefunden – in ${st.moves} Zügen!` : 'Tippe zwei Karten an. Passen sie zusammen, bleiben sie offen. Sonst werden sie wieder umgedreht – merk dir, wo was liegt!'}</p>
      <div class="wgTools"><button type="button" class="pill" data-act="new">${fin ? '🔁 Nochmal spielen' : '🔀 Neu mischen'}</button></div></div>`;
    el.querySelectorAll('.mmCard').forEach(b=> b.addEventListener('click', ()=> flip(+b.dataset.pos)));
    el.querySelector('[data-act="full"]').addEventListener('click', ()=>{ full = !full; document.body.style.overflow = full ? 'hidden' : ''; draw(); });
    el.querySelector('[data-act="new"]').addEventListener('click', ()=>{ st = fresh(); open = []; busy = false; save(); draw(); });
  };
  const setCard = (pos, cls, on) => el.querySelector(`.mmCard[data-pos="${pos}"]`)?.classList.toggle(cls, on);
  const stat = ()=>{ const s = el.querySelector('.mmStat'); if(s) s.innerHTML = `Paare: <b>${st.found.length}/${P}</b> · Züge: <b>${st.moves}</b>`; };
  const flip = pos => {
    if(busy || done()) return;
    const c = cards[st.order[pos]];
    if(st.found.includes(c.p) || open.includes(pos)) return;
    open.push(pos); setCard(pos, 'open', true);
    if(open.length < 2) return;
    st.moves++;
    const [a, b] = open.map(q=> cards[st.order[q]]);
    if(a.p === b.p){
      st.found.push(a.p); save();
      open.forEach(q=> setCard(q, 'found', true)); open = [];
      stat();
      if(done()){ draw(); celebrate(d, 'memory'); onSolved(); }
    } else {
      save(); stat(); busy = true;
      setTimeout(()=>{ open.forEach(q=> setCard(q, 'open', false)); open = []; busy = false; }, 1100);
    }
  };
  draw();
  if(done()) onSolved();
}

function personLink(base, name){ return String(base||'').trim().split('#')[0] + '#fuer=' + encodeURIComponent(name.trim()); }
function linkCard(name, cb, type){
  const W = 1200, H = 630, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const cs = getComputedStyle(document.documentElement);
  const c1 = cs.getPropertyValue('--bg1').trim() || '#1f4a3a', c2 = cs.getPropertyValue('--bg2').trim() || '#2f6b4f';
  const gold = META.doorBorderColor || '#f2c869';

  const finish = ()=>{
    if(!textOn){ cb(type ? cv.toDataURL(type, .86) : cv.toDataURL('image/png')); return; }

    x.textAlign = 'center'; x.textBaseline = 'middle';
    const fit = (t, size, maxW, font) => { let s = size; do { x.font = `bold ${s}px ${font}`; s -= 2; } while(x.measureText(t).width > maxW && s > 16); };
    x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 8;
    x.fillStyle = '#fff6e6'; const title = ((META.icon ? META.icon + ' ' : '') + (META.title||'Adventskalender')).trim();
    fit(title, 64, W-140, 'Georgia, serif'); x.fillText(title, W/2, 170);
    x.fillStyle = gold; fit('für ' + name, 92, W-140, 'Georgia, serif'); x.fillText('für ' + name, W/2, 310);
    x.shadowBlur = 0;
    x.fillStyle = '#fff6e6'; x.beginPath(); x.roundRect ? x.roundRect(W/2-300, 420, 600, 96, 48) : x.rect(W/2-300, 420, 600, 96); x.fill();
    x.fillStyle = '#1a2e1f'; x.font = 'bold 38px Georgia, serif'; x.fillText('🎁 Hier öffnen', W/2, 470);
    cb(type ? cv.toDataURL(type, .86) : cv.toDataURL('image/png'));
  };
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const bgSrc = META.cardImg || META.bgImage;

    const im = new Image();
    im.onload = ()=>{ const s = Math.max(W/im.width, H/im.height); x.drawImage(im, (W - im.width*s)/2, (H - im.height*s)/2, im.width*s, im.height*s); finish(); };
    im.onerror = finish; im.src = bgSrc;
  } else finish();
}
function copyText(text, btn){
  const ok = ()=>{ const o = btn.textContent; btn.textContent = '✓ Kopiert'; setTimeout(()=> btn.textContent = o, 1500); };
  const fallback = ()=>{ const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); ok(); }catch(e){} t.remove(); };

}

/* kleiner ZIP-Ersteller (ohne Komprimierung) */
const CRC_T = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c = n; for(let k=0;k<8;k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u){ let c = 0xFFFFFFFF; for(let i=0;i<u.length;i++) c = CRC_T[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dt = ((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)) & 0xFFFF, dd = (((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()) & 0xFFFF;
  files.forEach(f=>{
    const name = enc.encode(f.name), data = f.data, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,dt,true); h.setUint16(12,dd,true);
    h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,dt,true); c.setUint16(14,dd,true);
    c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,name.length,true); c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer), name);
    off += 30 + name.length + data.length;
  });
  const cSize = central.reduce((a,b)=>a+b.length,0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cSize,true); e.setUint32(16,off,true);

function dataUrlBytes(u){ const b = atob(u.split(',')[1]); const a = new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i] = b.charCodeAt(i); return a; }

    box.querySelector('img').addEventListener('load', ()=> draw());
    box.addEventListener('click', e=>{
      const rc = box.getBoundingClientRect(), x = (e.clientX-rc.left)/rc.width*100, y = (e.clientY-rc.top)/rc.height*100;
      const ar = rc.height / rc.width;
      let hit = -1;
      D.spots.forEach((p,i)=>{ if(found.includes(i)) return; const dx = x-p.x, dy = (y-p.y)*ar; if(Math.hypot(dx,dy) <= p.r*1.15) hit = i; });
      if(hit >= 0){ found.push(hit); lsSetJSON(key, found); if(draw()) onSolved(); }
      else { draw({box, x, y}); setTimeout(()=>{ if(el.isConnected) draw(); }, 600); }
    });
  });
  /* Vergrößern: beide Bilder so groß wie möglich, nebeneinander (Querformat) oder untereinander (Hochformat) */
  const box = el.querySelector('.df'), pair = el.querySelector('.dfPair'), zb = el.querySelector('[data-act="full"]');
  const fitDf = ()=>{
    const boxes = el.querySelectorAll('.dfImg');
    if(!box.classList.contains('full')){ pair.classList.remove('row'); boxes.forEach(b=> b.style.width = ''); return; }
    const img = boxes[0].querySelector('img'), ar = img.naturalWidth ? img.naturalHeight / img.naturalWidth : 0.75;
    const W = pair.clientWidth, H = pair.clientHeight, gap = 8;
    const wRow = Math.min((W - gap) / 2, H / ar), wCol = Math.min(W, (H - gap) / 2 / ar);
    pair.classList.toggle('row', wRow > wCol);
    boxes.forEach(b=> b.style.width = Math.floor(Math.max(wRow, wCol, 120)) + 'px');
  };
  zb.addEventListener('click', ()=>{ const on = box.classList.toggle('full'); zb.textContent = on ? '🔍 Verkleinern' : '🔍 Vergrößern'; document.body.style.overflow = on ? 'hidden' : ''; requestAnimationFrame(fitDf); });
  window.addEventListener('resize', ()=>{ if(el.isConnected) fitDf(); });
  el.querySelectorAll('.dfImg img').forEach(im=> im.addEventListener('load', fitDf));
  if(draw() ) onSolved();
}

  if(type === 'sudoku' && d.sudoku) body += `<div class="pSd">${sudokuTableHtml(d.sudoku, true, d.sdNums !== false)}</div>`;
  if(type === 'crossword' && d.crossword){

    let t = '<table class="pCw">';
    for(let r=0;r<C.h;r++){ t += '<tr>'; for(let c=0;c<C.w;c++){ const mi = C.marks.findIndex(m=>m[0]===r&&m[1]===c); t += C.rows[r][c]==='#' ? '<td class="blk"></td>' : `<td class="${mi>=0?'mark':''}">${numAt[r*C.w+c]?`<small>${numAt[r*C.w+c]}</small>`:''}${mi>=0?`<i>${mi+1}</i>`:''}</td>`; } t += '</tr>'; }
    t += '</table>';
    const list = dd => C.words.filter(x=>x.dir===dd).map(x=>`${x.num}. ${esc(x.clue)} (${x.len})`).join('<br>');
    body += t + `<p><b>Waagerecht:</b><br>${list('h')}</p><p><b>Senkrecht:</b><br>${list('v')}</p>` + (C.marks.length ? `<p>Lösungswort: ${C.marks.map((_,k)=>`${k+1}:___`).join(' ')}</p>` : '');
  }
  if(type === 'lettersudoku' && d.sudoku) body += `<div class="pSd">${sudokuTableHtml(d.sudoku, true, d.sdNums !== false)}</div>`;
  if(type === 'anagram') body += (d.anagram||[]).map((x,i)=>`<p>${i+1}. <b style="letter-spacing:4px">${esc(x.s)}</b>${x.hint?` (${esc(x.hint)})`:''} → ____________</p>`).join('');
  if(type === 'hangman' && d.hangman) body += `<p style="font-size:22px; letter-spacing:6px">${upDE(d.hangman.word).replace(/[A-ZÄÖÜß]/g,'_')}</p>${d.hangman.hint?`<p>Hinweis: ${esc(d.hangman.hint)}</p>`:''}`;
  if(type === 'cloze' && d.cloze){ const ps = clozeParts(d.cloze.text); body += `<p>${ps.map(x=> x.gap ? '_'.repeat(Math.max(8, x.gap[0].length+4)) : esc(x.t)).join('')}</p>` + (d.cloze.bank ? `<p>Wörter: ${shuffleArr(ps.filter(x=>x.gap).map(x=>x.gap[0])).map(esc).join(', ')}</p>` : ''); }
  if(type === 'whoami') body += `<ol>${(d.whoami||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ol>`;
  if(type === 'match' && d.match){ const R2 = shuffleArr(d.match.map(p=>p[1])); body += `<table style="border-collapse:collapse">${d.match.map((p,i)=>`<tr><td style="padding:6px 30px 6px 0">${i+1}. ${esc(p[0])}</td><td style="padding:6px 0">${String.fromCharCode(65+i)}) ${esc(R2[i])}</td></tr>`).join('')}</table>`; }
  if(type === 'lock' && d.lock) body += `<p style="font-size:22px">🔒 Code: ${'☐ '.repeat(String(d.lock.code).length)}</p>`;
  if(type === 'maze' && d.maze) body += `<div style="max-width:16cm">${mazeSvg(d.maze, null)}</div>`;
  if(type === 'diff' && d.diff) body += `<img src="${d.diff.a}" alt=""><img src="${d.diff.b}" alt=""><p>Finde ${d.diff.spots.length} Unterschiede.</p>`;
  if(type === 'puzzle' && d.puzzle) body += `<img src="${d.puzzle.img}" alt="">`;
  if(type === 'memory' && d.memory) body += `<p>Memory-Karten zum Ausschneiden:</p><div class="pMm">${mmCards(d.memory).map(c=>{ const f = d.memory.pairs[c.p][c.s]; return `<div>${f.img ? `<img src="${f.img}" alt="">` : ''}${f.t ? `<span>${esc(f.t)}</span>` : ''}</div>`; }).join('')}</div>`;
  if(type === 'quiz') body += (d.quiz||[]).map((q,qi)=>`<p><b>${qi+1}. ${esc(q.q)}</b><br>${q.a.map((a,ai)=>`☐ ${String.fromCharCode(65+ai)}) ${esc(a)}`).join('<br>')}</p>`).join('');
  pa.innerHTML = `<h1>Tag ${d.day}: ${esc(d.title)}</h1>`
    + (d.text ? fmtText(d.text) : '')
    + ((d.intro||'').trim() && (TYPE_FIELDS[type]||[]).includes('intro') ? `<div class="pIntro">${fmtText(d.intro)}</div>` : '')
    + (d.code ? `<div class="pCode">${esc(d.code)}</div>` : '')
    + body
    + imgs.map(src=>`<img src="${src}" alt="">`).join('')
    + ((d.answer||'').trim() ? `<p class="pLine">Meine Lösung: ______________________________</p>` : '');
  setTimeout(()=>{ try{ window.print(); }catch(e){} }, 300);
}

/* ---------- Vollbild mit Zoom ---------- */
const lb = document.getElementById('lightbox');
const lbScroll = document.getElementById('lbScroll');
const lbImg = document.getElementById('lbImg');
let lbList = [], lbIdx = 0, lbScale = 1, lbDay = 0;
function openLightbox(list, i, day){ lbList = list; lbIdx = i||0; lbDay = day; lb.hidden = false; showLb(); }
function closeLightbox(){ lb.hidden = true; lbImg.removeAttribute('src'); }
function showLb(){
  lbImg.onload = ()=> setScale(1);
  lbImg.src = lbList[lbIdx];
  const many = lbList.length > 1;
  document.getElementById('lbCount').textContent = many ? `Bild ${lbIdx+1} von ${lbList.length}` : '';
  document.getElementById('lbPrev').hidden = !many;
  document.getElementById('lbNext').hidden = !many;
  const save = document.getElementById('lbSave');
  save.href = lbList[lbIdx];
  save.download = `tag-${lbDay}-bild-${lbIdx+1}.jpg`;
}
function setScale(s){
  const cw = lbScroll.clientWidth, ch = lbScroll.clientHeight;
  const fx = (lbScroll.scrollLeft + cw/2) / (lbScroll.scrollWidth || 1);
  const fy = (lbScroll.scrollTop + ch/2) / (lbScroll.scrollHeight || 1);
  lbScale = Math.min(6, Math.max(1, s));
  if(lbScale <= 1.001){
    lbScale = 1; lbScroll.classList.remove('zoomed'); lbImg.style.width = ''; lbImg.style.height = '';
    return;
  }
  const nw = lbImg.naturalWidth || 1, nh = lbImg.naturalHeight || 1;
  const fit = Math.min(cw/nw, ch/nh);
  lbScroll.classList.add('zoomed');
  lbImg.style.width = (nw*fit*lbScale) + 'px';
  lbImg.style.height = (nh*fit*lbScale) + 'px';
  lbScroll.scrollLeft = fx*lbScroll.scrollWidth - cw/2;
  lbScroll.scrollTop = fy*lbScroll.scrollHeight - ch/2;
}
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbIn').addEventListener('click', ()=> setScale(lbScale*1.5));
document.getElementById('lbOut').addEventListener('click', ()=> setScale(lbScale/1.5));
document.getElementById('lbFit').addEventListener('click', ()=> setScale(1));
document.getElementById('lbPrev').addEventListener('click', ()=>{ lbIdx = (lbIdx-1+lbList.length)%lbList.length; showLb(); });
document.getElementById('lbNext').addEventListener('click', ()=>{ lbIdx = (lbIdx+1)%lbList.length; showLb(); });
lbImg.addEventListener('dblclick', ()=> setScale(lbScale > 1 ? 1 : 2.5));
let pinch = null, lastTap = 0;
lbScroll.addEventListener('touchstart', e=>{
  if(e.touches.length === 2){
    const [a,b] = e.touches;
    pinch = { d0: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), s0: lbScale };
  }
}, {passive:true});
lbScroll.addEventListener('touchmove', e=>{
  if(pinch && e.touches.length === 2){
    e.preventDefault();
    const [a,b] = e.touches;
    setScale(pinch.s0 * Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY) / pinch.d0);
  }
}, {passive:false});
lbScroll.addEventListener('touchend', e=>{
  if(e.touches.length < 2 && pinch){ pinch = null; lastTap = 0; return; }
  if(e.touches.length === 0 && e.changedTouches.length === 1){
    const now = Date.now();
    if(now - lastTap < 300){ e.preventDefault(); setScale(lbScale > 1 ? 1 : 2.5); lastTap = 0; }
    else lastTap = now;
  }
});
window.addEventListener('resize', ()=>{ if(!lb.hidden) setScale(lbScale); });

          <div id="sd_wordWrap" hidden><label for="sd_word">Lösungswort</label>

            <label for="sd_dir">Wo steht das Lösungswort?</label>
            <select id="sd_dir"><option value="cells">verteilt in farbigen Feldern (Wort darf länger sein, Buchstaben dürfen doppelt vorkommen)</option><option value="rand">in einer Linie, Richtung zufällig</option><option value="row">waagerecht (in einer Zeile)</option><option value="col">senkrecht (in einer Spalte)</option><option value="diag">diagonal (von links oben nach rechts unten)</option></select></div>
          <label for="sd_tips">Wie viele Feld-Tipps darf man nutzen?</label>
          <select id="sd_tips"><option value="0">keine</option><option value="1">1</option><option value="3" selected>3</option><option value="5">5</option><option value="10">10</option><option value="-1">unbegrenzt</option></select>
          <p class="hint">ⓘ Ein Feld-Tipp deckt ein Feld auf: das ausgewählte oder ein zufälliges. Die farbigen Lösungsfelder werden dabei möglichst ausgespart.</p>
          <label for="sd_nums">Farbige Lösungsfelder: wie schwer?</label>
          <select id="sd_nums">
            <option value="1">leicht – farbige Felder mit Nummern 1, 2, 3 …</option>
            <option value="0">schwer – farbige Felder ohne Nummern</option>
          </select>
          <p class="hint">ⓘ Leicht: Die Nummern zeigen, in welcher Reihenfolge die Felder gelesen werden. Schwer: Man muss selbst darauf kommen, dass man die farbigen Felder Zeile für Zeile von oben nach unten liest, wie in einem Buch (beim Buchstaben-Sudoku: entlang der Linie von links bzw. oben). Lässt sich jederzeit ändern, ohne das Sudoku neu zu erzeugen.</p>
          <div class="actions"><button type="button" class="pill" id="sd_make">Sudoku erzeugen</button><button type="button" class="pill primary" id="sd_add" disabled>Ins Türchen übernehmen</button></div>
          <div id="sd_preview"></div>
          <p class="toolMsg" id="sd_msg"></p>
        </details>
        <p class="toolMsg" id="f_sdState"></p>

          <input type="text" id="cw_sol" placeholder="z. B. STERN">

          <div class="actions"><button type="button" class="pill" id="cw_make">Kreuzworträtsel erzeugen</button><button type="button" class="pill primary" id="cw_add" disabled>Ins Türchen übernehmen</button></div>
          <div id="cw_preview"></div>
          <p class="toolMsg" id="cw_msg"></p>
        </details>
        <p class="toolMsg" id="f_cwState"></p>

      <div class="fsec" data-f="qz">
        <label>Quizfragen</label>

        <div class="toolPreview" id="an_prev"></div>
        <p class="hint">ⓘ Die Buchstaben werden beim Speichern gemischt. Umlaute werden zu AE, OE, UE.</p>

      <div class="fsec" data-f="hm">
        <label for="hm_word">Gesuchtes Wort oder kurzer Satz</label>
        <input type="text" id="hm_word" value="${esc(d.hangman?.word||'')}" placeholder="z. B. Mord im Pfarrhaus">
        <label for="hm_hint">Hinweis (optional, wird über dem Wort gezeigt)</label>
        <input type="text" id="hm_hint" value="${esc(d.hangman?.hint||'')}" placeholder="z. B. Ein Fall für Miss Marple">
        <label for="hm_lives">Erlaubte Fehlversuche</label>
        <select id="hm_lives"><option>5</option><option>6</option><option selected>8</option><option>10</option></select>
      </div>
      <div class="fsec" data-f="cz">
        <label for="cz_text">Text mit Lücken: das fehlende Wort in [eckige Klammern] setzen</label>
        <textarea id="cz_text" style="min-height:120px" placeholder="Der Inspektor betrat das [Arbeitszimmer]. Auf dem Schreibtisch lag ein [Brief] mit einem roten [Siegel].">${esc(d.cloze?.text||'')}</textarea>
        <label class="check"><input type="checkbox" id="cz_bank" ${d.cloze?.bank===false?'':'checked'}> Fehlende Wörter als Liste zur Auswahl zeigen (leichter)</label>
        <p class="hint">ⓘ Mehrere erlaubte Schreibweisen mit | trennen, z. B. [Brief|Briefumschlag].</p>
      </div>
      <div class="fsec" data-f="wa">
        <label for="wa_clues">Hinweise (eine Zeile pro Hinweis, vom schwersten zum leichtesten)</label>

      </div>
      <div class="fsec" data-f="mt">
        <label for="mt_pairs">Paare (eine Zeile pro Paar: Links = Rechts)</label>
        <textarea id="mt_pairs" style="min-height:120px" placeholder="Hercule Poirot = Belgien&#10;Miss Marple = St. Mary Mead&#10;Inspector Barnaby = Midsomer">${esc((d.match||[]).map(p=>p[0]+' = '+p[1]).join('\n'))}</textarea>
      </div>
      <div class="fsec" data-f="lk">
        <label for="lk_code">Code des Schlosses (3 bis 6 Ziffern)</label>
        <input type="text" id="lk_code" inputmode="numeric" value="${esc(d.lock?.code||'')}" placeholder="z. B. 1890">

        <label for="lk_tries">Wie viele Versuche?</label>

        <select id="lk_wait"><option value="1">1 Minute warten, dann neue Versuche</option><option value="5" selected>5 Minuten warten</option><option value="60">1 Stunde warten</option><option value="0">Schloss bleibt zu (nur Lösung aufdecken)</option></select>
