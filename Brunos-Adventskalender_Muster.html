<style id="appStyle">

.toolbar{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:14px 0; position:relative; z-index:2; padding:0 12px; }

<script type="application/json" id="doorData">[{"day": 1, "image": "", "text": "**Brunos Tagebuch – Dienstag, 1. Dezember**\nLiebes Tagebuch,\nheute Morgen hing plötzlich ein Kalender an der Wand, mit 24 Türchen und einer Zahl auf jedem. Frauchen sagt, das sei ein Adventskalender. Ich sage: Das ist ein Leckerli-Lager in Wandhöhe. Leider bin ich 38 Zentimeter groß und die Wand ist 250 Zentimeter hoch. Das nennt man einen Planungsfehler. Nicht meinen, versteht sich.\nIch habe es trotzdem versucht: zweimal hochgesprungen, einmal gegen die Kommode, einmal gegen den Papierkorb. Der Papierkorb hat verloren.\nHerrchen hat mir dann erklärt, dass jeden Tag nur ein Türchen aufgeht. Täglich eins! Einem Hund 24 Tage lang eine Überraschung vorzuenthalten ist ungefähr so, als würde man einem Wecker das Klingeln verbieten.\n**Fazit des Tages:**\nIch habe Geduld. Fast. Also eigentlich nicht. Aber ich übe.", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 0, "celTheme": "", "intro": "", "type": "story", "title": "1. Dezember – Der Kalender hängt!", "remind": "Guten Morgen, {Name}! Brunos Tagebuch hat einen neuen Eintrag, und der Kalender hängt in einer Höhe, die für einen Hund eindeutig zu hoch ist. Türchen {Tag} verrät mehr."}, {"day": 2, "image": "", "text": "**Brunos Tagebuch – Mittwoch, 2. Dezember**\nLiebes Tagebuch,\nheute war Zahnkontrolle beim Tierarzt. Ich wurde auf einen glänzenden Tisch gehoben, und mir wurde gesagt, ich solle „Aaah“ machen. Ich habe stattdessen „Wuff“ gesagt. Das war ein Kompromiss.\nDr. Hansen hat mir mit dem Finger durchs Maul gefahren und halblaut gezählt: eins, zwei, drei … Bei der Hälfte habe ich gegähnt, und sie musste von vorn anfangen. Beim zweiten Mal hat Herrchen mitgezählt, beim dritten Mal haben alle durcheinander gezählt, und ich habe ein Leckerli verlangt.\nAm Ende hat Dr. Hansen gesagt, ich hätte ein Gebiss wie ein kleiner Haifisch, aber ein sehr freundlicher. Ich bin stolz. Die Zahl hat sie auch laut verkündet. Leider habe ich sie über dem Leckerli sofort vergessen.\n**Fazit des Tages:**\nZähne zählen ist anstrengend. Vor allem für den, der sie hat.\n**Die Hundefrage des Tages:**\nHilfst du mir? Wie viele Zähne hat ein erwachsener Hund?", "video": "", "images": [], "hints": ["Ein Mensch hat 32 Zähne, ein Hund hat mehr.", "Die Zahl liegt zwischen 40 und 45.", "Im Oberkiefer sind es 20 Zähne, im Unterkiefer 22."], "hideNum": false, "clue": "", "level": 1, "celTheme": "", "intro": "Wie viele Zähne hat ein erwachsener Hund? Tippe die Zahl ein.", "type": "question", "title": "2. Dezember – Zahnkontrolle", "remind": "Guten Morgen, {Name}! Bruno war beim Tierarzt und hat vor lauter Gähnen die Zahl der Zahnkontrolle vergessen. Kannst du ihm helfen? Türchen {Tag}.", "code": "", "answer": "42", "solution": "Ein erwachsener Hund hat 42 Zähne, 20 im Oberkiefer und 22 im Unterkiefer. Welpen haben zuerst nur 28 Milchzähne.", "solMode": "hints"}, {"day": 3, "image": "", "text": "**Brunos Tagebuch – Donnerstag, 3. Dezember**\nLiebes Tagebuch,\nheute hat Herrchen im Garten einen roten Ball geworfen. Ich bin sofort losgerannt, in vollem Tempo, mit wehenden Ohren. Leider in die falsche Richtung. Der Ball lag im Gras, und ich habe ihn einfach nicht gesehen. Dabei ist er knallrot.\nHerrchen hat mir erklärt, dass Hunde die Farben Rot und Grün kaum unterscheiden können. Für mich sieht das Gras ungefähr so aus wie der Ball: bräunlich und langweilig. Das erklärt vieles.\nAlso habe ich meine Nase angeworfen und den Ball nach Geruch gefunden. Drei Sekunden, dann war er meiner. Danach habe ich so lange gehechelt, dass mir die Zunge fast bis zu den Pfoten hing. Schwitzen können wir Hunde kaum, nur ein bisschen an den Pfoten. Deshalb hecheln wir, das ist unsere Klimaanlage.\n**Fazit des Tages:**\nDie Augen können sich irren. Die Nase nie.\n**Das Hunde-Quiz zur Geschichte:**\nDrei Fragen, und du bist Brunos Ballexperte.", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 1, "celTheme": "", "intro": "Wähle jeweils die richtige Antwort aus.", "type": "quiz", "title": "3. Dezember – Der rote Ball", "remind": "Hallo {Name}! Bruno hat heute einen roten Ball nicht gefunden, obwohl er direkt vor seiner Nase lag. Warum, verrät Türchen {Tag}, mit einem kleinen Quiz.", "quiz": [{"q": "Welche Farben kann ein Hund am schlechtesten unterscheiden?", "a": ["Blau und Gelb", "Schwarz und Weiß", "Rot und Grün", "Hellblau und Weiß"], "c": 2}, {"q": "Womit kühlt sich ein Hund hauptsächlich ab?", "a": ["Mit Schwitzen am ganzen Körper", "Mit Hecheln", "Mit schnellem Schwanzwedeln", "Mit Ohrenwackeln"], "c": 1}, {"q": "Womit hat Bruno den roten Ball am Ende gefunden?", "a": ["Mit den Augen", "Mit den Ohren", "Mit der Nase", "Mit Herrchens Hilfe"], "c": 2}]}, {"day": 4, "image": "", "text": "**Brunos Tagebuch – Freitag, 4. Dezember**\nLiebes Tagebuch,\nüber Nacht hat jemand den Gehweg mit Glas überzogen. Frauchen nennt es Glatteis, ich nenne es Frechheit. Ich bin mit Schwung losgelaufen und habe bis zur Laterne vier Pfoten in vier verschiedene Richtungen gleichzeitig bewegt. Das war kein Ausrutscher, das war Kunst.\nHerrchen hat gelacht. Ich habe ihm das nicht vergessen. Zwei Meter später hat er selbst ein Solo hingelegt, mit Armen wie eine Windmühle. Ich habe mit Würde zugeschaut. Mit sehr viel Würde.\nZum Trost gab es zu Hause ein Leckerli. Ich habe es mit gebührendem Ernst angenommen.\n**Fazit des Tages:**\nWer auf vier Pfoten rutscht, hat wenigstens zwei Reserven mehr als die Zweibeiner.", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 0, "celTheme": "", "intro": "", "type": "story", "title": "4. Dezember – Der Hund auf Glatteis", "remind": "Hallo {Name}! Draußen ist es glatt geworden, und Bruno hat eine ganz eigene Technik, damit umzugehen. Wie sie aussieht, steht in Türchen {Tag}."}, {"day": 5, "image": "", "text": "**Brunos Tagebuch – Samstag, 5. Dezember**\nLiebes Tagebuch,\nmein Tag begann mit einem leeren Napf. Das ist eine Katastrophe, aber sie hat sich nach genau einer Minute in Luft aufgelöst, weil Frauchen den Napf gefüllt hat. Dann kam die Leine. Wenn sie rasselt, bin ich in null Komma nichts an der Tür.\nDraußen lag Schnee, der erste in diesem Winter! Ich habe jeden Meter mit der Pfote geprüft, und jeder war gut. Ein Stock lag am Wegrand, den ich sofort zum Knochen erklärt habe. Niemand hat widersprochen.\nAn der Ecke stand ein Nachbarshund hinter dem Zaun. Ich habe ihm laut zugerufen: „Wuff!“ Er hat „Wuff!“ geantwortet. Ein Gespräch, das ganze zwei Minuten dauerte. Ich glaube, wir haben uns verstanden.\n**Fazit des Tages:**\nWer viel erlebt, hat abends einen Hund, der vor Müdigkeit umfällt.\n**Das Rätsel zur Geschichte:**\nAlles, was ich heute erlebt habe, steckt im Buchstabengitter.", "video": "", "images": [], "hints": ["Die Wörter stehen waagerecht oder senkrecht.", "Suche zuerst nach KNOCHEN, das ist das längste Wort.", "Das Lösungswort verrät, was ein Hund mit dem Schwanz macht, wenn er sich freut."], "hideNum": false, "clue": "", "level": 1, "celTheme": "", "intro": "Finde alle Wörter aus der Geschichte und markiere sie. Die übrigen Buchstaben ergeben das Lösungswort.", "type": "wordgrid", "title": "5. Dezember – Spaziergang im Schnee", "remind": "Guten Morgen, {Name}! Bruno hat den ersten Schnee entdeckt, mit Leine, Napf und Pfote. Alles, was er erlebt hat, versteckt sich im Gitter in Türchen {Tag}.", "wordgrid": {"rows": ["TDPFOTEKBQ", "WUFFWOLNVO", "TBWSIPEOOE", "ENGCPBICCX", "EKPHLGNHGD", "UQNNDTEECJ", "NIDEBTNNRN", "UEGETNTWRA", "ELXRYAIYFP", "KSAMKENTSF"], "words": ["KNOCHEN", "LEINE", "NAPF", "PFOTE", "SCHNEE", "WUFF"], "sol": {"word": "WEDELN", "cells": [14, 29, 54, 71, 81, 96]}}, "wgNums": false, "answer": "WEDELN", "gridLock": true}, {"day": 6, "image": "", "text": "**Brunos Tagebuch – Sonntag, 6. Dezember (Nikolaus)**\nLiebes Tagebuch,\ngestern Abend hat Frauchen einen Stiefel vor die Tür gestellt. Ich habe darauf hingewiesen, dass ich in Sachen Schuhwerk deutlich mehr Erfahrung habe, vor allem im Kauen. Sie hat den Stiefel trotzdem draußen gelassen.\nHeute früh war er gefüllt: Mandarinen, Nüsse und ein Knochen aus Rinderhaut. Ein Knochen! Der Nikolaus hat also nicht nur an die Menschen gedacht. Ich habe den Stiefel zur Sicherheit einmal komplett ausgeschnüffelt und dabei den halben Inhalt auf dem Fußboden verteilt. Frauchen sagt, das ist keine Sicherheitsprüfung.\nDen Knochen habe ich unter dem Sofa versteckt. Falls der Nikolaus es sich anders überlegt.\n**Fazit des Tages:**\nDer Nikolaus kommt durch jede Tür. Ich kontrolliere trotzdem sicherheitshalber jede Ecke.", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 0, "celTheme": "", "intro": "", "type": "story", "title": "6. Dezember (Nikolaus) – Der Stiefel vor der Tür", "remind": "Einen schönen Nikolaustag, {Name}! Im Stiefel von Bruno liegt etwas, das nicht in jeden Stiefel passt. Schau in Türchen {Tag}."}, {"day": 7, "image": "", "text": "**Brunos Tagebuch – Montag, 7. Dezember**\nLiebes Tagebuch,\nheute Abend ist es so gemütlich, dass ich kaum zu beschreiben weiß, wie gemütlich es ist. Ich liege vor dem Kamin, das Feuer knistert, und ich träume von Würsten.\nAuf dem Tisch steht der Adventskranz mit den ersten zwei brennenden Kerzen, und Frauchen trinkt Tee. Herrchen wickelt ein Geschenk in rotes Papier. Er sagt, ich dürfe nicht wissen, was es ist. Ich habe auch nicht gefragt.\nMitten in der Gemütlichkeit habe ich plötzlich die Nase gehoben. Von irgendwoher kam ein Geruch, der mich sofort hellwach gemacht hat. Wurst! Herrchens Abendbrot, nur zwei Meter entfernt. Ich habe den Blick aufgesetzt, den ich für solche Momente trainiere.\n**Fazit des Tages:**\nGemütlichkeit ist schön. Wurst ist schöner.\n**Das Rätsel zur Geschichte:**\nBeim Aufschreiben sind mir ein paar Wörter weggerutscht. Hilfst du mir?", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 1, "celTheme": "", "intro": "Ergänze die fehlenden Wörter. Die Wörter zur Auswahl stehen im Kasten.", "type": "cloze", "title": "7. Dezember – Der Duft vom Kamin", "remind": "Hallo {Name}! Heute ist es bei Bruno am Kamin gemütlich, bis seine Nase etwas entdeckt. In Türchen {Tag} fehlen ein paar Wörter in der Geschichte.", "cloze": {"text": "Es ist Abend. Bruno liegt vor dem [Kamin] und träumt. Auf dem Tisch steht der [Adventskranz], und Frauchen trinkt [Tee]. Herrchen wickelt ein [Geschenk] in rotes Papier. Bruno hebt die [Nase] und weiß sofort: Das riecht nach [Wurst]!", "bank": true}}, {"day": 8, "image": "", "text": "**Brunos Tagebuch – Dienstag, 8. Dezember**\nLiebes Tagebuch,\nheute hat mich Herrchen gefragt, warum ich mich vor dem Hinlegen dreimal im Kreis drehe. Als Hund beantwortet man solche Fragen nicht, man lebt sie. Aber ich will ausnahmsweise erklären, wie das Ganze funktioniert.\nErstens muss das Kissen kontrolliert werden. Zweitens muss die Decke in die richtige Form gebracht werden. Drittens ist das ein uraltes Ritual, das meine Vorfahren schon in hohem Gras gemacht haben, um sich ein Nest zu treten. Kein Gras? Egal. Ritual ist Ritual.\nHerrchen sagt, das sei Instinkt. Ich sage: Gründlichkeit.\n**Hundewissen des Tages:**\nDas Drehen vor dem Schlafen stammt vermutlich noch von den Vorfahren der Hunde. Sie traten Gras oder Laub nieder, um sich ein bequemes und sicheres Lager zu bauen.\n**Fazit des Tages:**\nDreimal gedreht, einmal geseufzt, sofort geschlafen. Das ist Effizienz.", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 0, "celTheme": "", "intro": "", "type": "story", "title": "8. Dezember – Warum drehen sich Hunde im Kreis?", "remind": "Guten Morgen, {Name}! Bruno dreht sich vor dem Schlafen immer dreimal im Kreis. Warum das so ist, verrät dir Türchen {Tag}."}, {"day": 9, "image": "", "text": "**Brunos Tagebuch – Mittwoch, 9. Dezember**\nLiebes Tagebuch,\nHerrchen sitzt auf dem Sofa und löst ein Zahlenrätsel in der Zeitung. Er sagt „Sudoku“. Ich sage: Das sind Kästchen mit Ziffern, die sich nicht entscheiden können.\nEr hat den Stift in der einen Hand und den Radiergummi in der anderen. Alle paar Minuten sagt er „Ach so!“ und alle paar Minuten sagt er „Nein, doch nicht.“ Das kenne ich: Ich mache es genauso, wenn ich mich vor dem Napf nicht zwischen Trockenfutter und Nassfutter entscheiden kann.\nIrgendwann bin ich auf die Zeitung gesprungen, mitten auf die Ziffern, und habe mich daraufgelegt. Herrchen hat gelacht und gesagt, dann müsse ich es eben selbst lösen. Das hat er nicht ernst gemeint. Ich habe es trotzdem ernst genommen.\n**Fazit des Tages:**\nWer Ziffern liebt, braucht Ruhe. Wer Ruhe liebt, braucht ein Sofa.\n**Das Rätsel zur Geschichte:**\nHier ist ein Sudoku, extra für dich und mit Brunos Segen.", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 1, "celTheme": "", "intro": "Fülle das Gitter aus. In jeder Zeile, jeder Spalte und jedem Kasten steht jede Zahl nur einmal. Die farbigen Felder ergeben den Code.", "type": "sudoku", "title": "9. Dezember – Das Sudoku auf dem Sofa", "remind": "Guten Morgen, {Name}! Herrchen löst ein Sudoku, und Bruno liegt mittendrin. Das Rätsel dazu wartet in Türchen {Tag}.", "sudoku": {"n": 9, "kind": "std", "W": 9, "mode": "code", "dir": "", "row": -1, "marks": [2, 14, 25, 54], "answer": "9421", "sol": "389712546712564938465983721627439185894157362531826479146398257253671894978245613", "puz": "3....25...1..6....4..9....16274391.....1..3625.....479...39.2.72.3..1..497.2.5613", "symbols": "123456789", "givens": 38}, "sdTips": 3, "sdNums": true, "gridLock": true, "answer": "9421", "solution": "Der Code aus den farbigen Feldern lautet 9421.", "solMode": "hints"}, {"day": 10, "image": "", "text": "**Brunos Tagebuch – Donnerstag, 10. Dezember**\nLiebes Tagebuch,\nin der Küche duftet es seit Stunden nach Zimt, Butter und Verbrechen. Frauchen backt Plätzchen. Ich liege seit Stunden vor der Ofentür und habe dabei eine beeindruckende Haltung gezeigt: Ohren nach vorn, Nase auf Anschlag, Augen auf Dackelblick.\nLeider steht das Blech zu hoch. Ich habe es mit dem Hinsetzen versucht, mit dem Pfötchengeben und mit einem Seufzer, den man bis ins Wohnzimmer gehört hat. Ergebnis: ein Stück Möhre. Ich bin tief getroffen.\nFrauchen hat mir erklärt, dass Plätzchen mit Schokolade für Hunde tabu sind. Man sagt es mir nicht zum ersten Mal, und ich habe es mir diesmal sogar gemerkt. Fast.\n**Wichtig für alle Hundebesitzer:**\nSchokolade ist für Hunde giftig, vor allem dunkle Sorten. Auch Rosinen, Trauben und Zuckerersatz wie Xylit gehören nicht in den Hundenapf.\n**Fazit des Tages:**\nDie Möhre war okay. Aber ich hätte lieber das Plätzchen gehabt.", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 0, "celTheme": "", "intro": "", "type": "story", "title": "10. Dezember – Plätzchenalarm", "remind": "Hallo {Name}! In der Küche duftet es, und ein Hund wartet seit Stunden vor dem Ofen. Was Bruno heute erlebt, steht in Türchen {Tag}."}, {"day": 11, "image": "", "text": "**Brunos Tagebuch – Freitag, 11. Dezember**\nLiebes Tagebuch,\nheute hat Frauchen unter meinem Körbchen aufgeräumt und dabei meine Schatzkiste entdeckt. Ich hatte sie nicht versteckt, ich hatte sie nur sehr gut gelagert.\nDarin waren: ein Knochen, den ich beim Nikolaus bekommen und für den Notfall zurückgelegt habe. Eine Möhre, die ich nie aufgegessen habe, weil ich Möhren eigentlich nicht mag. Ein Tannenzweig vom Adventskranz, rein zufällig heruntergefallen. Ein Salzteig-Stern mit dem Abdruck meiner Pfote, den wir zusammen gebastelt haben. Und eine Schneeflocke, die ich im Schnee gefunden und sorgfältig mitgenommen hatte. Sie ist leider geschmolzen.\nFrauchen hat alles aufgezählt, ohne zu lachen, nur mit einem Zucken an den Mundwinkeln. Danach hat sie die Sachen zurückgelegt, jedes an seinen Platz. Ich war sehr dankbar.\n**Fazit des Tages:**\nEin gutes Körbchen hat doppelten Boden. Das ist Hundewissen.\n**Das Rätsel zur Geschichte:**\nHilf mir, meine Schätze wiederzufinden, in Paaren, immer ein Bild und das passende Wort.", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 1, "celTheme": "", "intro": "Finde jeweils ein Symbol und das passende Wort.", "type": "memory", "title": "11. Dezember – Brunos Schatzkiste", "remind": "Hallo {Name}! Frauchen hat unter Brunos Körbchen aufgeräumt und eine Schatzkiste gefunden. Was drin war, erfährst du in Türchen {Tag}, mit einem Memory.", "memory": {"pairs": [{"a": {"t": "🦴", "img": ""}, "b": {"t": "Knochen", "img": ""}}, {"a": {"t": "🐾", "img": ""}, "b": {"t": "Pfote", "img": ""}}, {"a": {"t": "🌲", "img": ""}, "b": {"t": "Tannenzweig", "img": ""}}, {"a": {"t": "🛏️", "img": ""}, "b": {"t": "Körbchen", "img": ""}}, {"a": {"t": "❄️", "img": ""}, "b": {"t": "Schneeflocke", "img": ""}}, {"a": {"t": "🥕", "img": ""}, "b": {"t": "Möhre", "img": ""}}], "back": "🐶"}, "answer": ""}, {"day": 12, "image": "", "text": "**Brunos Tagebuch – Samstag, 12. Dezember**\nLiebes Tagebuch,\nheute ist der Weihnachtsbaum eingezogen. Ich habe ihn sofort inspiziert, gründlich von unten nach oben. Er riecht nach Wald, nach Harz und ein bisschen nach einem Eichhörnchen, das ich leider nicht zu fassen bekam.\nDann hat Herrchen Lichterketten gehängt, silberne Kugeln und Strohsterne. Mir wurde ausdrücklich erklärt, dass das nicht zum Spielen da ist. Ich habe ausdrücklich genickt. Die unterste Kugel habe ich nur ganz kurz angestupst, aus rein wissenschaftlichem Interesse. Sie ist dreimal quer durchs Wohnzimmer gerollt. Das war Physik.\nDie Katze Schnurri hat vom Sofa aus alles beobachtet und nichts gesagt. Das ist ihr gefährlichster Gesichtsausdruck.\n**Fazit des Tages:**\nDer Baum steht. Die Kugel hängt. Der Hund war es nicht.", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 0, "celTheme": "", "intro": "", "type": "story", "title": "12. Dezember – Die Baum-Inspektion", "remind": "Guten Morgen, {Name}! Der Baum steht, und Bruno hat ihn schon einmal gründlich kontrolliert. Ob er dabei unschuldig geblieben ist, erfährst du in Türchen {Tag}."}, {"day": 13, "image": "", "text": "**Brunos Tagebuch – Sonntag, 13. Dezember (3. Advent)**\nLiebes Tagebuch,\nFrauchen hat ein Weihnachtsbild von mir gemalt: Ich mit roter Zipfelmütze, neben einem Tannenbaum, unter einem Sternenhimmel, mit Pfotenabdrücken im Schnee. Es ist wunderschön, und ich sehe darauf sehr gut aus. Das sage ich nicht oft über mich.\nSie hat es auf den Tisch gelegt, damit es trocknet. Dann kam Schnurri. Die Katze hat sich auf den Tisch gesetzt, das Bild lange angesehen und sich dann mit der Pfote bedient. Nur ein kleiner Schubs. Plötzlich lagen überall Schnipsel, und Frauchen musste das Bild wie ein Puzzle neu zusammensetzen.\nIch habe geholfen, indem ich daneben gesessen und Mut zugesprochen habe. Das ist die wichtigste Aufgabe in einem Rudel.\n**Fazit des Tages:**\nEin Kunstwerk überlebt alles. Auch eine Katze.\n**Das Rätsel zur Geschichte:**\nHilfst du mir, das Bild wieder zusammenzusetzen?", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 1, "celTheme": "", "intro": "Tausche die Teile so lange, bis das Bild wieder stimmt.", "type": "puzzle", "title": "13. Dezember – Das zerfallene Weihnachtsbild", "remind": "Guten Morgen, {Name}! Schnurri hat Brunos Weihnachtsbild vom Tisch geschubst, und jetzt liegt alles in Teilen. Türchen {Tag} wartet auf dich.", "puzzle": {"img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wAARCAMgAyADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBA  habe ich im Park einen Welpen kennengelernt. Er war etwa so groß wie mein Napf und hatte Pfoten, die viel zu groß für ihn waren. Er hat gewedelt, so heftig, dass er hinten umgefallen ist.\nIch habe versucht, ihm etwas beizubringen. Erstens: Nicht an der Leine ziehen. Zweitens: Wer bellen will, bellt in die Luft und nicht ins Ohr des Nachbarn. Drittens: Die Schnauze hält man nicht in jede Pfütze. Er hat zugehört, mit schiefem Kopf und offenem Maul, und dann in die nächste Pfütze gesprungen.\nZum Schluss hat er mir etwas gesagt. Er hat nur ein einziges, kurzes Wort gewusst, mit vier Buchstaben, aber er hat es mit voller Überzeugung gesagt. Ich habe zurückgesagt: dasselbe Wort. Es war ein gutes Gespräch.\n**Fazit des Tages:**\nJunge Hunde kann man nicht erziehen. Man kann sie nur gernhaben.\n**Das Rätsel zur Geschichte:**\nMit den Wörtern aus meiner Geschichte füllst du das Kreuzworträtsel.", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 2, "celTheme": "", "intro": "Löse das Kreuzworträtsel mit Hilfe der Geschichte. Die markierten Felder ergeben der Reihe nach das Lösungswort.", "type": "crossword", "title": "14. Dezember – Der Welpe im Park", "remind": "Guten Morgen, {Name}! Bruno hat im Park einen Welpen getroffen, der nur ein einziges Wort kannte. Welches, steht in Türchen {Tag}.", "crossword": {"w": 9, "h": 8, "rows": ["#WEDELN##", "#####E###", "###B#I###", "###E#NAPF", "#WELPE#F#", "###L###O#", "###E###T#", "SCHNAUZE#"], "words": [{"num": 1, "dir": "h", "r": 0, "c": 1, "len": 6, "clue": "Das macht der Schwanz, wenn sich der Hund freut"}, {"num": 2, "dir": "v", "r": 0, "c": 5, "len": 5, "clue": "Daran führt man den Hund spazieren"}, {"num": 3, "dir": "v", "r": 2, "c": 3, "len": 6, "clue": "So meldet ein Hund, dass jemand an der Tür ist"}, {"num": 4, "dir": "h", "r": 3, "c": 5, "len": 4, "clue": "Daraus frisst der Hund"}, {"num": 5, "dir": "v", "r": 3, "c": 7, "len": 5, "clue": "Damit gibt der Hund Pfötchen"}, {"num": 6, "dir": "h", "r": 4, "c": 1, "len": 5, "clue": "So nennt man einen jungen Hund"}, {"num": 7, "dir": "h", "r": 7, "c": 0, "len": 8, "clue": "Anderes Wort für Nase und Maul beim Hund"}], "marks": [[0, 1], [7, 5], [3, 8], [4, 7]], "sol": "WUFF", "failed": []}, "answer": "WUFF", "gridLock": true, "solution": "Das Lösungswort heißt WUFF.", "solMode": "hints"}, {"day": 15, "image": "", "text": "**Brunos Tagebuch – Dienstag, 15. Dezember**\nLiebes Tagebuch,\nheute kam ein Paket. Ich habe es schon gehört, als der Lieferwagen noch um die Ecke bog. Wenn ich den Motor erkenne, bevor Herrchen die Klingel hört, dann liegt das nicht an Zufall, sondern an Talent. Ich habe laut gemeldet: „Wuff!“ Zweimal, damit es alle merken.\nDer Postbote hat das Paket abgegeben und gesagt: „Der ist ja ein ganz Braver!“ Ich habe mit dem Schwanz gewedelt, und zwar mit der linken Seite zuerst. Man muss ja nicht gleich übertreiben.\nIm Paket war übrigens nichts für mich. Dafür aber eine riesige Kiste aus Pappe, in der ich zwanzig Minuten verschwunden bin. Hunde lieben Kisten. Ich weiß auch nicht warum, aber sie sind perfekt.\n**Hundewissen des Tages:**\nHunde hören viel höhere Töne als wir Menschen, sie nehmen Geräusche bis etwa 45.000 Hertz wahr. Menschen hören nur bis rund 20.000.\n**Fazit des Tages:**\nDas Paket war nicht für mich. Die Kiste schon.", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 0, "celTheme": "", "intro": "", "type": "story", "title": "15. Dezember – Der Postbote kommt", "remind": "Hallo {Name}! Ein Lieferwagen biegt um die Ecke, und Bruno hat ihn schon lange gehört. Was dann passiert, erfährst du in Türchen {Tag}."}, {"day": 16, "image": "", "text": "**Brunos Tagebuch – Mittwoch, 16. Dezember**\nLiebes Tagebuch,\nes gibt ein Wort, das ich durch geschlossene Türen höre, durch Wände, durch Fernseher und durch einen Staubsauger. Es hat acht Buchstaben, beginnt mit L und lässt meine Ohren hochschnellen wie zwei Antennen.\nFrauchen und Herrchen haben es sich daher abgewöhnt. Sie buchstabieren es, wenn sie davon sprechen, oder sie sagen „das Ding“. Das hat leider nichts gebracht. Ich habe nämlich schon gelernt, die Buchstaben zu erkennen. Wenn sie anfangen zu flüstern, bin ich schon an der Küchentür.\nHeute Morgen hat Herrchen „L … E … C …“ geflüstert, und ich saß schon vor dem Schrank. Er hat nur den Kopf geschüttelt. Ich habe mit den Augen gesagt: Versuch es erst gar nicht.\n**Fazit des Tages:**\nEin Hund kann nicht lesen. Aber dieses eine Wort kann er.\n**Das Rätsel zur Geschichte:**\nWelches Wort ist es? Das Buchstaben-Sudoku verrät es dir.", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 2, "celTheme": "", "intro": "Fülle das Gitter mit Buchstaben. In jeder Zeile, Spalte und jedem Kasten kommt jeder Buchstabe nur einmal vor. Die farbigen Felder ergeben das Lösungswort.", "type": "lettersudoku", "title": "16. Dezember – Das Zauberwort", "remind": "Hallo {Name}! Es gibt ein Wort, das Bruno durch jede Wand hört. Welches? Das Buchstaben-Sudoku in Türchen {Tag} verrät es.", "sudoku": {"n": 9, "kind": "std", "W": 9, "mode": "word", "dir": "cells", "row": -1, "marks": [5, 19, 37, 44, 45, 55, 63, 76], "answer": "LECKERLI", "sol": "NDREKLSCIILSCDNRKEKECSRINDLDKLNCEISRRCNISDELKESIKLRCNDSRDLECKINLIKRNSDECCNEDIKLRS", "puz": "NDR.K..CII.S.....EK.CS..ND.DKLNC...RR.N.S.....SI.LRC....DLEC..N..KRN...C.....K...", "symbols": "CDEIKLNRS", "givens": 38}, "sdTips": 3, "sdNums": true, "gridLock": true, "answer": "LECKERLI", "solution": "Das Lösungswort in den farbigen Feldern heißt LECKERLI.", "solMode": "hints"}, {"day": 17, "image": "", "text": "**Brunos Tagebuch – Donnerstag, 17. Dezember**\nLiebes Tagebuch,\nFrauchen hat mir einen Wintermantel gekauft. Er ist rot, hat Knöpfe und sieht aus, als würde ich bei einer Adventsfeier für Hunde arbeiten. Ich habe ihn angezogen bekommen, ohne gefragt zu werden. So fängt es immer an.\nBeim ersten Spaziergang bin ich gelaufen wie ein Michelin-Männchen: breitbeinig, gerade und mit sehr viel Haltung. Eine Dackeldame auf der anderen Straßenseite hat gekichert. Ich habe so getan, als sei das Absicht.\nAber ehrlich gesagt: Es ist warm darin. Meine Ohren sind kalt, aber mein Rücken ist ein kleiner Ofen. Ich gebe es nur ungern zu. Wirklich nur ungern.\n**Fazit des Tages:**\nDer Mantel bleibt. Aber nur, wenn niemand ein Foto macht.", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 0, "celTheme": "", "intro": "", "type": "story", "title": "17. Dezember – Der Mantel", "remind": "Guten Morgen, {Name}! Bruno hat einen neuen Mantel bekommen und trägt ihn mit sehr viel Würde. Warum die Dackeldame kichert, erfährst du in Türchen {Tag}."}, {"day": 18, "image": "", "text": "**Brunos Tagebuch – Freitag, 18. Dezember**\nLiebes Tagebuch,\nim Park habe ich heute Blitz getroffen, einen Greyhound. Er ist so schlank, dass man ihn von der Seite fast nicht sieht. Er hat mir erklärt, dass Greyhounds die schnellsten Hunde der Welt sind. Ich habe gesagt: „Schön, dann laufe ich eben auf der Gemütlichkeits-Spur.“ Blitz hat gelacht.\nWir sind trotzdem zusammen gerannt, er zehn Sekunden, ich zehn Meter. Danach habe ich mich ins Gras gelegt. Das ist normal. Ein Hund, der keinen Mittagsschlaf macht, ist ein kranker Hund. Wir schlafen ungefähr zwölf bis vierzehn Stunden am Tag, manchmal auch mehr. Das ist kein Faulsein, das ist Fachkompetenz.\nZu Hause hat Frauchen einen Zettel an den Kühlschrank gehängt: „Schokolade nicht in Hundereichweite!“ Ich habe ihn gelesen, jedenfalls habe ich lange darauf gestarrt. Schokolade ist für Hunde giftig. Das merke ich mir. Für den Fall, dass sie jemand vergisst.\n**Fazit des Tages:**\nSchnelligkeit ist nicht alles. Wichtiger ist, dass man abends noch Pfoten hat.\n**Das Quiz zur Geschichte:**\nDrei Fragen, ganz ohne Schweißausbruch.", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 2, "celTheme": "", "intro": "Wähle die richtige Antwort aus.", "type": "quiz", "title": "18. Dezember – Der Greyhound", "remind": "Guten Morgen, {Name}! Bruno hat einen Greyhound getroffen und etwas über Schlaf und Schokolade gelernt. Das Quiz wartet in Türchen {Tag}.", "quiz": [{"q": "Welcher Hund gilt als einer der schnellsten?", "a": ["Greyhound", "Dackel", "Mops", "Basset"], "c": 0}, {"q": "Wie viele Stunden schläft ein erwachsener Hund am Tag ungefähr?", "a": ["2 bis 4 Stunden", "12 bis 14 Stunden", "22 Stunden", "Gar nicht"], "c": 1}, {"q": "Was ist für Hunde an Weihnachten besonders gefährlich?", "a": ["Karotten", "Äpfel", "Schokolade", "Haferflocken"], "c": 2}]}, {"day": 19, "image": "", "text": "**Brunos Tagebuch – Samstag, 19. Dezember**\nLiebes Tagebuch,\nheute habe ich beschlossen, draußen zu schlafen. Im Garten steht nämlich mein kleines Haus, aus Holz, mit Spitzdach und einem Eingang genau in meiner Größe. Dort habe ich vor langer Zeit mal gewohnt, als ich noch jung und unvernünftig war.\nIch bin hineingegangen, habe mich zweimal gedreht und mich hingelegt. Draußen schneite es leise. Nach zehn Minuten habe ich gemerkt, dass es dort sehr kalt und sehr dunkel war und dass ich nicht wusste, wo meine Decke ist.\nFrauchen hat mich nach einer halben Stunde reingeholt. Sie hat gesagt: „Ach Bruno, du alter Held.“ Ich habe nichts gesagt. Ich habe nur schnell das Sofa besetzt.\n**Fazit des Tages:**\nEin Haus im Garten ist schön. Ein Sofa im Wohnzimmer ist besser.\n**Das Bilderrätsel zur Geschichte:**\nWie heißt das kleine Holzhaus, in dem ich fast geschlafen hätte?", "video": "", "images": [], "hints": ["Das Bild zeigt einen Hund.", "Das zweite Teil ist ein kleines Haus aus Holz.", "Beides zusammen ergibt das Zuhause eines Hundes im Garten."], "hideNum": false, "clue": "", "level": 1, "celTheme": "", "intro": "Setze die Teile zusammen. Welches Wort entsteht?", "type": "rebus", "title": "19. Dezember – Die Nacht im Garten", "remind": "Hallo {Name}! Bruno wollte im Garten schlafen, in seinem kleinen Holzhaus. Wie es dort war und wie das Haus heißt, steht in Türchen {Tag}.", "code": "🐶 + HÜTTE", "answer": "HUNDEHÜTTE", "solution": "Hund + Hütte = HUNDEHÜTTE.", "solMode": "hints"}, {"day": 20, "image": "", "text": "**Brunos Tagebuch – Sonntag, 20. Dezember (4. Advent)**\nLiebes Tagebuch,\nheute brennen alle vier Kerzen. Ich habe versucht, sie zu zählen, aber bei drei bin ich eingeschlafen. Das liegt nicht an mir, sondern am Kerzenlicht. Es ist warm, gelb und für müde Hunde gefährlicher als jedes Schlaflied.\nFrauchen hat Tee gekocht, Herrchen hat die Füße hochgelegt, und ich habe mich zwischen die beiden gequetscht, mit der Schnauze auf Herrchens Hausschuh. Der ist übrigens ein sehr guter Kopfstützen-Ersatz, auch wenn er nach Socke riecht.\nDraußen hat es leise angefangen zu schneien. Ich habe kurz aufgeschaut, mir gedacht „Schön“ und weitergeschnarcht.\n**Fazit des Tages:**\nRuhe ist das schönste Geschenk. Und ein Hausschuh ist ein Kopfkissen.", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 0, "celTheme": "", "intro": "", "type": "story", "title": "20. Dezember (4. Advent) – Vier Kerzen", "remind": "Einen schönen 4. Advent, {Name}! Alle vier Kerzen brennen, und Bruno kommt kaum noch mit dem Zählen hinterher. Türchen {Tag}."}, {"day": 21, "image": "", "text": "**Brunos Tagebuch – Montag, 21. Dezember**\nLiebes Tagebuch,\nauf dem Weihnachtsmarkt habe ich heute einen Hund getroffen, der in der Manteltasche einer Dame saß. In der Manteltasche! Er hat nur den Kopf herausgestreckt und mich von oben angesehen, so wie ein König von seinem Thron.\nIch bin etwa so groß wie ein Fußhocker, aber neben ihm kam ich mir vor wie ein Elefant. Er hatte einen kleinen roten Pullover an, Augen wie zwei Knöpfe und Ohren wie zwei Segel. Er hat ganz leise gebellt, wie ein Quietschen. Ich habe höflich zurückgegrüßt.\nSeine Besitzerin hat gesagt, er sei der kleinste Hund, den sie je gehabt habe, und gleichzeitig der mutigste. Das glaube ich. Er hat mich angeknurrt, und ich bin einen Schritt zurückgegangen. Aus Respekt.\n**Fazit des Tages:**\nGröße ist nicht alles. Mut passt in jede Tasche.\n**Die Hundefrage des Tages:**\nDer kleine Hund gehört zur kleinsten Rasse der Welt. Weißt du, wie sie heißt?", "video": "", "images": [], "hints": ["Der Name beginnt mit C.", "Die Rasse hat ihren Namen von einem Bundesstaat in Mexiko.", "Der Name beginnt mit Chi und endet auf huahua."], "hideNum": false, "clue": "", "level": 1, "celTheme": "", "intro": "Welche Hunderasse ist die kleinste der Welt?", "type": "question", "title": "21. Dezember – Die Dame mit der Manteltasche", "remind": "Guten Morgen, {Name}! Bruno hat auf dem Weihnachtsmarkt einen Hund in einer Manteltasche getroffen. Die Frage dazu wartet in Türchen {Tag}.", "code": "", "answer": "Chihuahua", "solution": "Der Chihuahua ist die kleinste Hunderasse der Welt. Er wird nur etwa 15 bis 23 Zentimeter groß.", "solMode": "hints"}, {"day": 22, "image": "", "text": "**Brunos Tagebuch – Dienstag, 22. Dezember**\nLiebes Tagebuch,\nunter dem Baum liegen Geschenke. Ich habe sie alle beschnüffelt, einmal rundherum, systematisch von links nach rechts. Ergebnis: Das rote Päckchen riecht nach Kaffee, das große nach Pappe und das kleine mit der Schleife nach Hund. Nach HUND! Ich habe es drei Mal kontrolliert. Es gab keinen Zweifel.\nIch habe das Frauchen angezeigt, indem ich mich vor das Päckchen gelegt und nicht mehr bewegt habe. Sie hat gelacht. Ich auch, innerlich.\nHerrchen sagt, ich soll nicht schnüffeln. Aber meine Nase ist wie ein Detektiv ohne Dienstzeiten. Sie arbeitet immer.\n**Hundewissen des Tages:**\nDie Nase eines Hundes ist ein Hochleistungsinstrument. Sie hat Millionen mehr Riechzellen als die menschliche Nase. Deshalb kann ein Hund Dinge riechen, die für uns unsichtbar bleiben.\n**Fazit des Tages:**\nIch weiß, was unter dem Baum liegt. Ich sage nur nicht, was.", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 0, "celTheme": "", "intro": "", "type": "story", "title": "22. Dezember – Die Nase weiß alles", "remind": "Guten Morgen, {Name}! Unter dem Baum liegt ein Päckchen, das nach Hund riecht, jedenfalls findet Brunos Nase das. Mehr in Türchen {Tag}."}, {"day": 23, "image": "", "text": "**Brunos Tagebuch – Mittwoch, 23. Dezember**\nLiebes Tagebuch,\nmorgen ist Heiligabend, und ich habe heute eine Inventur gemacht. Das macht man so, bevor etwas Großes passiert. Ich bin durchs ganze Haus gegangen und habe alles gezählt, was nach Weihnachten aussieht.\nAuf dem Tisch steht eine Kerze, bei der ich nicht an die Flamme darf. Oben auf dem Baum glänzt ein Stern aus Stroh. Unter der Tanne liegen Geschenke, und ich hatte eine ausführliche Besprechung mit jedem einzelnen. In der Küche duften noch die Plätzchen vom Wochenende, die mir nicht zustehen. Und ganz unten am Baum hängt eine silberne Kugel, die ich schon einmal geprüft habe.\nDie Inventur hat zwei Stunden gedauert. Danach war ich so müde, dass ich im Stehen eingeschlafen bin. Frauchen hat mich ins Körbchen getragen, und ich habe so getan, als sei ich noch wach.\n**Fazit des Tages:**\nMorgen wird alles gut. Heute reicht es, wenn man alles gezählt hat.\n**Das Rätsel zur Geschichte:**\nAlles, was ich gezählt habe, steckt im Gitter.", "video": "", "images": [], "hints": ["Die Wörter stehen waagerecht oder senkrecht.", "Das längste Wort ist PLAETZCHEN, mit AE statt Ä.", "Das Lösungswort beschreibt die Zeit vor Weihnachten."], "hideNum": false, "clue": "", "level": 2, "celTheme": "", "intro": "Finde alle Wörter aus der Geschichte und markiere sie. Die übrigen Buchstaben ergeben das Lösungswort.", "type": "wordgrid", "title": "23. Dezember – Die große Inventur", "remind": "Hallo {Name}! Morgen ist Heiligabend, und Bruno hat heute Inventur gemacht. Was er alles gezählt hat, versteckt sich im Gitter in Türchen {Tag}.", "wordgrid": {"rows": ["RKUGELTTPX", "ABLVBNYUTW", "XFHDXNVHWF", "GESCHENKKE", "KERZEUQRSJ", "IELROPXJJJ", "EJVTANNELU", "PLAETZCHEN", "RNUSTERNEX", "OTFISQWKUU"], "words": ["GESCHENK", "KERZE", "KUGEL", "PLAETZCHEN", "STERN", "TANNE"], "sol": {"word": "ADVENT", "cells": [10, 23, 26, 51, 81, 91]}}, "wgNums": false, "answer": "ADVENT", "gridLock": true}, {"day": 24, "image": "", "text": "**Brunos Tagebuch – Donnerstag, 24. Dezember (Heiligabend)**\nLiebes Tagebuch,\ndas letzte Türchen. Ich habe 24 Tage durchgehalten, und das ohne ein einziges Mal die Wand hochzuspringen. Na gut, dreimal. Aber nur ganz kurz.\nHeute Abend ist das Wohnzimmer voller Kerzen, und das kleine Päckchen mit der Schleife ist endlich aufgegangen. Es war ein Kauknochen. Ein richtig großer. Ich war vollkommen sprachlos, was bei mir selten vorkommt.\nFrauchen und Herrchen sitzen auf dem Sofa, die Katze Schnurri hat sich auf die Lehne gesetzt und tut so, als gehöre sie nicht dazu. Ich liege auf den Füßen von allen, so wie sich das gehört. Ein Hund kann viel verlangen. Aber das hier ist alles, was ich brauche.\n**Fazit des Tages:**\nEin Rudel, ein Sofa, ein Knochen. Frohe Weihnachten, liebes Tagebuch.\nDein Bruno", "video": "", "images": [], "hints": [], "hideNum": false, "clue": "", "level": 0, "celTheme": "", "intro": "", "type": "story", "title": "24. Dezember – Heiligabend 🎁 – Das schönste Geschenk", "remind": "Frohe Weihnachten, {Name}! Das letzte Türchen ist da, und Bruno hat eine Überraschung bekommen, mit der er nie gerechnet hätte. Öffne Türchen {Tag}!"}]</script>

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- Speicher pro Betrachter (Browser) ---------- */
/* Im Januar und Februar zählt noch die Saison vom letzten Dezember (Fortschritt bleibt erhalten) */
const YEAR0 = (d => d.getMonth() < 2 ? d.getFullYear() - 1 : d.getFullYear())(new Date());
/* Persönlicher Link: …#fuer=Anna oder …?fuer=Anna – eigener Fortschritt pro Name */
const FUER = (()=>{ try{ const q = new URLSearchParams(location.search).get('fuer'); const h = (location.hash.match(/fuer=([^&]+)/)||[])[1];
  return decodeURIComponent((q || h || '').replace(/\+/g,' ')).trim().slice(0,40); }catch(e){ return ''; } })();
const YEAR = FUER ? YEAR0 + '-' + (norm(FUER) || 'x') : String(YEAR0);
function personName(){ return (FUER || CEL().name || AW().recipient || '').trim().split(/\s+/)[0] || ''; }
function fillName(t){ const n = personName(); t = String(t ?? ''); return n ? t.replace(/\{name\}/gi, n) : t.replace(/,?\s*\{name\}/gi, ''); }
function allowedTypes(){ return Array.isArray(META.types) ? new Set(['story', ...META.types]) : null; }
const openedKey = 'advent_opened_' + YEAR;
const solvedKey = 'advent_solved_' + YEAR;
const revealedKey = 'advent_revealed_' + YEAR;
const hintKey = 'advent_hints_' + YEAR;
function lsList(k){ try{ return JSON.parse(localStorage.getItem(k)||"[]"); }catch(e){ return []; } }
function lsAdd(k,v){ try{ const a=lsList(k); if(!a.includes(v)){ a.push(v); localStorage.setItem(k, JSON.stringify(a)); } }catch(e){} }
const memHints = {};
function getHintCount(day){ try{ const o=JSON.parse(localStorage.getItem(hintKey)||"{}"); return o[day]||memHints[day]||0; }catch(e){ return memHints[day]||0; } }
function setHintCount(day,n){ memHints[day]=n; try{ const o=JSON.parse(localStorage.getItem(hintKey)||"{}"); o[day]=n; localStorage.setItem(hintKey, JSON.stringify(o)); }catch(e){} }
function getOpened(){ return lsList(openedKey); }
function markOpened(day){ lsAdd(openedKey, day); }
const isSolved = day => lsList(solvedKey).includes(day);
const isRevealed = day => lsList(revealedKey).includes(day);
const hasPuzzle = d => doorType(d) !== 'story' || !!((d.answer||'').trim() || (d.solution||'').trim());
function clueUnlocked(d){
  if(!(d.clue||'').trim()) return false;
  if(!isUnlocked(d.day)) return false;
  if(hasPuzzle(d)) return isSolved(d.day) || isRevealed(d.day);
  return getOpened().includes(d.day);
}

};
function applyTheme(){

  st.setProperty('--bg1', t.bg1); st.setProperty('--bg2', t.bg2); st.setProperty('--bg3', t.bg3);

}

/* ---------- Text in Absätze umwandeln ---------- */
function fmtText(t){
  const inline = x => x.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>');
  return String(t||'').replace(/\r/g,'').split(/\n+/).map(x=>x.trim()).filter(Boolean)
    .map(x=>`<p class="tx">${inline(x)}</p>`).join('');
}

/* ---------- Großes Lösungswort ---------- */
const bwKey = 'advent_bw_' + YEAR;
const LEVELS = ['', '★☆☆', '★★☆', '★★★'];
const LEVEL_NAMES = ['', 'leicht', 'mittel', 'schwer'];
function bwChars(){ return [...String(META.bigWord||'').toUpperCase()]; }
function bwLetters(){ return bwChars().filter(c=>c.trim()); }
function bwActive(){ const L = bwLetters(); return L.length > 0 && Array.isArray(META.bigDays) && META.bigDays.length === L.length; }
function bwMakeDays(word, mode){
  const n = [...String(word).toUpperCase()].filter(c=>c.trim()).length;
  const days = [...Array(24)].map((_,i)=>i+1);
  return mode === 'order' ? days.slice(0,n) : shuffleArr(days).slice(0,n);
}
function bwLetterOf(day){
  if(!bwActive()) return null;
  const k = META.bigDays.indexOf(day);
  return k < 0 ? null : { pos:k+1, ch:bwLetters()[k] };
}
function bwEarned(day){
  const d = DOORS.find(x=>x.day===day);
  if(!d || !isUnlocked(day)) return false;
  if(hasPuzzle(d)) return isSolved(day) || isRevealed(day);
  return getOpened().includes(day);
}
function bwCount(){ return bwActive() ? META.bigDays.filter(bwEarned).length : 0; }
function openBigWord(){
  const L = bwLetters();
  let k = 0;
  const cells = '<span class="bwWord">' + bwChars().map(c=>{
    if(!c.trim()) return '</span><span class="bwWord">';
    const day = META.bigDays[k], ch = L[k]; k++;
    const has = bwEarned(day) || previewMode;
    return `<span class="bwCell${has?'':' empty'}"><b>${has ? esc(ch) : ''}</b><small>Tag ${day}</small></span>`;
  }).join('') + '</span>';
  const done = lsList(bwKey).includes(1);
  modalContent.innerHTML = `<h2>🔠 Das große Lösungswort</h2>
    ${META.bigQuestion ? `<p style="margin-top:0"><b>${esc(META.bigQuestion)}</b></p>` : ''}
    <p style="margin-top:0">Jedes gelöste Türchen verrät dir einen Buchstaben. Unter jedem Feld steht, aus welchem Türchen er kommt. Gesammelt: ${bwCount()} von ${L.length}.</p>
    <div class="bwRow">${cells}</div>
    <form class="answerRow" id="bwForm"><input type="text" id="bwInput" autocomplete="off" placeholder="Lösungswort eintippen"><button type="submit" class="pill primary">Prüfen</button></form>
    <p class="feedback${done?' ok':''}" id="bwFb" aria-live="polite">${done ? '🎉 Gelöst! Das war das große Lösungswort.' : 'Du kannst jederzeit raten, auch wenn noch Buchstaben fehlen.'}</p>
    <button type="button" class="pill bottomClose" id="bottomClose">Schließen</button>`;
  document.getElementById('bottomClose').addEventListener('click', closeOverlay);
  document.getElementById('bwForm').addEventListener('submit', e=>{
    e.preventDefault();
    const fb = document.getElementById('bwFb'), g = norm(document.getElementById('bwInput').value);
    if(!g){ fb.textContent = 'Bitte zuerst ein Wort eintippen.'; fb.className = 'feedback bad'; return; }
    if(g === norm(META.bigWord)){
      lsAdd(bwKey, 1); fb.textContent = '🎉 Richtig! Das ist das große Lösungswort.'; fb.className = 'feedback ok';
      document.querySelectorAll('.bwCell').forEach(c=> c.classList.remove('empty'));
      let j = 0; document.querySelectorAll('.bwCell b').forEach(b=>{ b.textContent = L[j++]; });
      updateAkteBtn();
    } else { fb.textContent = 'Das ist es leider nicht. Sammle weiter Buchstaben!'; fb.className = 'feedback bad'; }
  });
  overlay.classList.add('show');
  modal.scrollTop = 0;
}

const awKeySeen = 'advent_bd_' + YEAR, awKeyCert = 'advent_aw_' + YEAR;
const MEDAL_COLORS = [['#fbe7a1','#c9971c'],['#f3f5f7','#9aa3ad'],['#f1c49a','#a0602b'],['#eef2f8','#8191a8']];
function AW(){
  const a = Object.assign({}, AW_DEF, META.award || {});
  a.ranks = AW_DEF.ranks.map((r,i)=> Object.assign({}, r, (META.award?.ranks||[])[i] || {}));
  a.badges = AW_DEF.badges.map((b,i)=> Object.assign({}, b, (META.award?.badges||[])[i] || {}));
  return a;
}
function awardStats(){
  const doors = DOORS.filter(d=> hasPuzzle(d));
  const st = {pts:0, max:0, self:0, help:0, rev:0, open:0, total:doors.length, tips:0, bw:null};
  doors.forEach(d=>{
    const t = doorType(d), bonus = t === 'whoami';
    st.max += 3 + (bonus ? 1 : 0);
    const s = isSolved(d.day), r = isRevealed(d.day);
    const h = getHintCount(d.day) + (lsGetJSON('advent_st_' + YEAR + '_' + d.day, []) || []).length;
    st.tips += h;
    if(s && !r){
      if(h > 0){ st.pts += 2; st.help++; } else { st.pts += 3; st.self++; }
      if(bonus && lsGetJSON('advent_wa_' + YEAR + '_' + d.day, 1) <= 2) st.pts += 1;
    } else if(r){ st.rev++; if(s) st.pts += 1; }
    else st.open++;
  });
  if(bwActive()){ st.max += 5; st.bw = lsList(bwKey).includes(1); if(st.bw) st.pts += 5; }
  st.solved = st.self + st.help;
  st.pct = st.max ? Math.round(st.pts / st.max * 100) : 0;
  return st;
}
function awardRank(a, st){ let i = a.ranks.findIndex(r=> st.pct >= (+r.min || 0)); if(i < 0) i = a.ranks.length - 1; return i; }
function awardUnlocked(a){
  if(previewMode) return true;
  if(!isUnlocked(24)) return false;
  const done = d => hasPuzzle(d) ? (isSolved(d.day) || isRevealed(d.day)) : getOpened().includes(d.day);
  if(a.unlock === 'all') return DOORS.every(done);
  const d24 = DOORS.find(d=> d.day === 24);
  return !!d24 && done(d24);
}
function medalHtml(a, i, size){
  const R = a.ranks[i];
  if(R.img) return `<img class="medalImg" src="${R.img}" alt="" style="width:${size}px;height:${size}px">`;
  const [c1,c2] = MEDAL_COLORS[Math.min(i,3)], acc = (THEMES[META.theme] || THEMES.klassisch).bg2;
  return `<svg class="medal" viewBox="0 0 100 120" width="${size}" height="${size*1.2}" aria-hidden="true">
    <polygon points="30,0 50,0 58,48 38,52" fill="${acc}"/><polygon points="70,0 50,0 42,48 62,52" fill="#b3261e"/>
    <defs><radialGradient id="mg${i}" cx="40%" cy="35%"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient></defs>
    <circle cx="50" cy="78" r="38" fill="url(#mg${i})" stroke="${c2}" stroke-width="3"/>
    <circle cx="50" cy="78" r="30" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="50" y="80" text-anchor="middle" dominant-baseline="middle" font-size="30">${esc(R.icon||'')}</text></svg>`;
}
function badgeIcon(b, size){ return b.img ? `<img src="${b.img}" alt="" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover">` : `<span style="font-size:${Math.round(size*.62)}px">${esc(b.icon||'🏅')}</span>`; }
function certHtml(a, st, i){

  return `<div class="cert"${bg}><div class="certIn">

function confetti(){

  a.badges.forEach((b,i)=>{ if(+b.at > 0 && st.solved >= +b.at && !seen.includes(i)){ lsAdd(awKeySeen, i); toast(`${badgeIcon(b, 34)}<div><small>Neues Abzeichen</small><b>${esc(b.name)}</b></div>`); } });

/* ---------- Erfolgs-Effekt (Konfetti & Nachricht) ---------- */
const celKey = 'advent_cel_' + YEAR;
const CEL_THEMES = {
  confetti:{ name:'🎉 Konfetti klassisch' },
  winter:{ name:'❄️ Winter', e:'❄️❅❆⛄' },
  spring:{ name:'🌸 Frühling', e:'🌸🌷🌼🦋' },
  summer:{ name:'☀️ Sommer', e:'☀️🌻🍉🍦' },
  autumn:{ name:'🍂 Herbst', e:'🍂🍁🍄🌰' },
  xmas:{ name:'🎄 Weihnachten', e:'⭐🎄🎁🔔' },
  bake:{ name:'🍪 Backen', e:'🍪🥨🧁🥐' },
  paws:{ name:'🐾 Hundepfoten', e:'🐾🦴🐶' },
  clover:{ name:'🍀 Glücksklee', e:'🍀☘️🐞' },
  crime:{ name:'🔍 Krimi', e:'🔍🕵️🔑👣' },
  custom:{ name:'✏️ Eigene Emojis' },
  image:{ name:'🖼 Eigenes Bild' }
};
function CEL(){ return Object.assign({ mode:'all', theme:'confetti', emojis:'', img:'', name:'', msgs:'Gut gemacht, {Name}! 🎉\nFall gelöst, {Name}!\nStark kombiniert, {Name}!' }, META.cel || {}); }
function splitEmojis(s){
  s = String(s||'').trim(); if(!s) return [];
  try{ return [...new Intl.Segmenter('de', {granularity:'grapheme'}).segment(s)].map(x=>x.segment).filter(x=>x.trim()); }catch(e){ return Array.from(s).filter(x=>x.trim() && x !== '️'); }
}
function celText(c){
  const list = String(c.msgs||'').split('\n').map(x=>x.trim()).filter(Boolean);
  if(!list.length) return '';
  const name = (FUER || c.name || AW().recipient || '').trim().split(/\s+/)[0] || '';
  let t = list[Math.floor(Math.random()*list.length)];
  t = name ? t.replace(/\{name\}/gi, name) : t.replace(/,?\s*\{name\}/gi, '');
  return t;
}
function celBurst(theme, c){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(theme === 'confetti' || (theme === 'image' && !c.img)){ confetti(); return; }
  const em = theme === 'custom' ? splitEmojis(c.emojis) : splitEmojis(CEL_THEMES[theme]?.e);
  if(theme !== 'image' && !em.length){ confetti(); return; }
  const box = document.createElement('div'); box.className = 'confetti celBox';
  for(let k=0;k<46;k++){
    const s = document.createElement('span'), size = 18 + Math.random()*20;
    s.style.left = Math.random()*100 + 'vw'; s.style.fontSize = size + 'px';
    s.style.animationDelay = (Math.random()*1.3) + 's'; s.style.animationDuration = (2.4 + Math.random()*2) + 's';
    if(theme === 'image') s.innerHTML = `<img src="${c.img}" alt="" style="width:${size*1.4}px;height:${size*1.4}px">`;
    else s.textContent = em[k % em.length];
    box.appendChild(s);
  }
  document.body.appendChild(box); setTimeout(()=> box.remove(), 5000);
}
function celShow(theme, c){
  celBurst(theme, c);
  const t = celText(c); if(!t) return;
  const m = document.createElement('div'); m.className = 'celMsg'; m.textContent = t;
  document.body.appendChild(m); setTimeout(()=> m.classList.add('show'), 20);
  setTimeout(()=>{ m.classList.remove('show'); setTimeout(()=> m.remove(), 400); }, 2800);
}
function celebrate(d, kind){
  const c = CEL();
  if(c.mode === 'off' || (c.mode === 'puzzle' && kind !== 'puzzle')) return;
  if(lsList(celKey).includes(d.day)) return;
  lsAdd(celKey, d.day);
  celShow(d.celTheme || c.theme, c);
}

    <button type="button" id="resetBtn">↺ Test zurücksetzen</button>`
    + (OFFLINE ? `<button type="button" id="fileSaveBtn" class="akte">📤 Kalender-Datei speichern</button><button type="button" id="fileLoadBtn">📥 Kalender-Datei laden</button>
    <p class="offNote"><span>💾 Deine Änderungen werden auf diesem Computer gespeichert. Wenn du fertig bist: „📤 Kalender-Datei speichern“ und die Datei deiner Schwester schicken.</span></p>` : '') : '')

  document.getElementById('bwBtn').addEventListener('click', openBigWord);

  document.getElementById('fileLoadBtn')?.addEventListener('click', openFileDialog);

  document.getElementById('editBtn').addEventListener('click', ()=>{
    editMode = !editMode;
    const b = document.getElementById('editBtn');
    b.textContent = editMode ? "✅ Bearbeiten beenden" : "✏️ Inhalte bearbeiten";
    b.classList.toggle('active', editMode);

  document.getElementById('settingsBtn').addEventListener('click', openSettingsForm);

    [openedKey, solvedKey, revealedKey, hintKey, bwKey, awKeySeen, awKeyCert, celKey].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
    try{ Object.keys(localStorage).filter(k=>['advent_wg_','advent_sd_','advent_cw_','advent_qz_','advent_an_','advent_hm_','advent_cz_','advent_wa_','advent_mt_','advent_lk_','advent_mz_','advent_pz_','advent_df_','advent_st_','advent_mm_'].some(p=>k.startsWith(p + YEAR + '_'))).forEach(k=>localStorage.removeItem(k)); }catch(e){}
    Object.keys(memHints).forEach(k=> delete memHints[k]);
    resetArmed = false; b.textContent = '↺ Test zurücksetzen';

}

/* ---------- Speichern (nur im Werkstatt-Link) ---------- */
function cleanHtml(){
  const root = document.documentElement.cloneNode(true);
  [...root.attributes].forEach(a=>{ if(a.name !== 'lang') root.removeAttribute(a.name); });
  root.querySelectorAll('script[src]').forEach(n=>n.remove());
  root.querySelectorAll('style').forEach(n=>{ if(n.id !== 'appStyle' && /swal2|chrome-extension/.test(n.textContent)) n.remove(); });
  const body = root.querySelector('body');
  if(body){
    [...body.attributes].forEach(a=>body.removeAttribute(a.name));
    const keepIds = ['snow','toolbar','grid','overlay','lightbox','printArea','doorData','calMeta','appScript'];
    [...body.children].forEach(ch=>{
      const tag = ch.tagName.toLowerCase();
      if(['header','footer','style','title','meta','link'].includes(tag) || keepIds.includes(ch.id)) return;
      ch.remove();
    });
  }
  ['snow','toolbar','grid','modalContent','printArea','lbCount'].forEach(id=>{ const n=root.querySelector('#'+id); if(n) n.innerHTML=''; });
  root.querySelector('#overlay')?.classList.remove('show');
  root.querySelector('#lightbox')?.setAttribute('hidden','');
  root.querySelector('#lbImg')?.removeAttribute('src');
  root.querySelector('#lbSave')?.setAttribute('href','#');
  const h = root.querySelector('#calIcon'); if(h){ h.textContent=''; h.removeAttribute('style'); }
  const s = root.querySelector('#subtitle'); if(s){ s.textContent=''; s.removeAttribute('style'); }
  const safe = x => JSON.stringify(x).replace(/</g,'\\u003c');
  let html = '<!DOCTYPE html>\n' + root.outerHTML;
  if(OFFLINE && !/<meta[^>]+charset/i.test(html.slice(0, 3000))) html = html.replace(/<head([^>]*)>/i, '<head$1><meta charset="utf-8">');
  if(OFFLINE && !/<meta[^>]+name="viewport"/i.test(html.slice(0, 3000))) html = html.replace(/<head([^>]*)>/i, '<head$1><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">');
  html = html.replace(/(<script type="application\/json" id="doorData">)[\s\S]*?(<\/script>)/, (m,a,b)=>a+safe(DOORS)+b);
  html = html.replace(/(<script type="application\/json" id="calMeta">)[\s\S]*?(<\/script>)/, (m,a,b)=>a+safe(META)+b);
  return html;
}
/* ---------- Werkstatt ohne Claude (z. B. GitHub): Speichern auf diesem Gerät + Kalender-Datei ---------- */
function idbOpen(){
  return new Promise((res, rej)=>{ try{ const r = indexedDB.open('adventBaukasten', 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('drafts');
    r.onsuccess = ()=> res(r.result); r.onerror = ()=> rej(r.error); }catch(e){ rej(e); } });
}
async function idbPut(val){ const db = await idbOpen(); return new Promise((res, rej)=>{ const tx = db.transaction('drafts','readwrite'); tx.objectStore('drafts').put(val, IDB_KEY); tx.oncomplete = ()=> res(true); tx.onerror = ()=> rej(tx.error); }); }
async function idbGet(){ const db = await idbOpen(); return new Promise((res, rej)=>{ const tx = db.transaction('drafts','readonly'); const q = tx.objectStore('drafts').get(IDB_KEY); q.onsuccess = ()=> res(q.result || null); q.onerror = ()=> rej(q.error); }); }
async function saveLocalDraft(){ await idbPut({ doors: DOORS, meta: META, t: Date.now() }); }
function fileName(){
  const base = (META.title || 'Adventskalender').normalize('NFKD').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-') || 'Adventskalender';
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${base}_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.html`;
}
function downloadCalendarFile(){
  const blob = new Blob([cleanHtml()], {type:'text/html'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName();
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('<span style="font-size:28px">📤</span><div><small>Kalender-Datei gespeichert</small><b>Sie liegt im Ordner „Downloads“</b></div>');
}
function readCalendarFile(file){
  return new Promise((res, rej)=>{ const r = new FileReader(); r.onload = ()=>{ try{
      const html = String(r.result);
      const dd = html.match(/<script type="application\/json" id="doorData">([\s\S]*?)<\/script>/);
      const mm = html.match(/<script type="application\/json" id="calMeta">([\s\S]*?)<\/script>/);
      if(!dd || !mm) throw new Error('keine Kalender-Datei');
      res({ doors: JSON.parse(dd[1]), meta: JSON.parse(mm[1]) });
    }catch(e){ rej(e); } }; r.onerror = ()=> rej(r.error); r.readAsText(file); });
}
function openFileDialog(){
  modalContent.innerHTML = `<h2>📥 Kalender-Datei laden</h2>
    <p>Hiermit holst du einen gespeicherten Stand zurück, zum Beispiel wenn du an einem anderen Computer weitermachen willst.</p>
    <p class="lockNote">Achtung: Was jetzt im Kalender steht, wird durch die Datei ersetzt.</p>
    <div class="editForm"><label for="ld_file">Kalender-Datei auswählen (endet auf .html)</label><input type="file" id="ld_file" accept=".html,text/html"></div>
    <p class="feedback" id="ld_msg"></p>
    <button type="button" class="pill bottomClose" id="bottomClose">Abbrechen</button>`;
  overlay.classList.add('show');
  document.getElementById('bottomClose').addEventListener('click', closeOverlay);
  document.getElementById('ld_file').addEventListener('change', async e=>{
    const f = e.target.files[0], msg = document.getElementById('ld_msg'); if(!f) return;
    try{
      const data = await readCalendarFile(f);
      DOORS = data.doors; META = data.meta;
      await saveLocalDraft();
      buildToolbar(); render();
      msg.className = 'feedback ok'; msg.textContent = '✓ Geladen. Du kannst weitermachen.';
    }catch(err){ msg.className = 'feedback bad'; msg.textContent = 'Das ist keine Kalender-Datei. Bitte die Datei wählen, die du mit „Kalender-Datei speichern“ erstellt hast.'; }
  });
}
async function loadLocalDraft(){
  if(!canEdit || !OFFLINE) return;
  try{ const d = await idbGet(); if(d && Array.isArray(d.doors) && d.meta){ DOORS = d.doors; META = d.meta; buildToolbar(); render(); } }catch(e){}
}

async function publishUpdate(statusEl){
  const say = t => { if(statusEl) statusEl.textContent = t; };
  if(!artifactApi && OFFLINE && canEdit){
    try{ await saveLocalDraft(); say('Gespeichert (auf diesem Computer).'); return true; }
    catch(e){ say('Speichern auf diesem Computer hat nicht geklappt. Bitte „📤 Kalender-Datei speichern“ drücken, damit nichts verloren geht.'); return false; }
  }
  if(!artifactApi){ say(canEdit ? 'In diesem Link kann nur die Besitzerin bzw. der Besitzer speichern. Bitte den Werkstatt-Link von GitHub verwenden.' : 'Speichern klappt nur im Werkstatt-Link (mit #edit am Ende).'); return false; }
  try{
    await artifactApi.publish(cleanHtml());
    say('Gespeichert.');
    return true;
  }catch(e){
    say('Speichern fehlgeschlagen: ' + (e?.code || e) + '. Bitte nochmal versuchen.');
    return false;
  }
}

function resizeImage(file, maxSize, quality, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w >= h && w > maxSize){ h = h*maxSize/w; w = maxSize; }
      else if(h > w && h > maxSize){ w = w*maxSize/h; h = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w); canvas.height = Math.round(h);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function isUnlocked(day){
  if(previewMode) return true;
  const now = new Date();
  if(now.getMonth()+1 < 3) return true; // Januar und Februar: alle Türchen offen zum Nachholen
  if(now.getMonth()+1 < CALENDAR_MONTH) return false;
  if(now.getMonth()+1 > CALENDAR_MONTH) return true;
  return now.getDate() >= day;
}

  else { document.body.style.backgroundImage=''; }

  grid.innerHTML = "";
  const opened = getOpened();
  const solved = lsList(solvedKey);
  const displayOrder = editMode ? DOORS.map(d=>d.day) : META.order;
  displayOrder.forEach(dayNum=>{
    const idx = DOORS.findIndex(x=>x.day===dayNum);
    const d = DOORS[idx];
    const el = document.createElement('div');
    const unlocked = isUnlocked(d.day) || editMode;
    const isOpen = unlocked && opened.includes(d.day);
    el.className = 'door' + (unlocked?'':' locked') + (isOpen?' opened':'') + (d.image?'':' placeholder');
    const bgAttr = d.image ? ` style="background-image:url('${d.image}')"` : '';
    const badge = (unlocked && solved.includes(d.day)) ? '<span class="solvedBadge" title="Gelöst">✓</span>' : '';
    const hideNum = !!d.image && (d.hideNum || META.hideNums);
    const plaque = !hideNum ? `<span class="plaque">${d.day}</span>` : editMode ? `<span class="plaque faint" title="Nummer ist für Empfänger ausgeblendet">${d.day}</span>` : '';
    el.innerHTML = `<div class="doorPanel"${bgAttr}></div>${plaque}${badge}`;
    el.setAttribute('aria-label', 'Türchen ' + d.day);
    if(unlocked){
      el.addEventListener('click', ()=>{
        if(editMode){ openEditForm(idx); return; }
        if(!isOpen){ markOpened(d.day); el.classList.add('opened'); }
        setTimeout(()=> openDoor(d), isOpen ? 0 : 380);
      });
    }
    grid.appendChild(el);
  });
  updateAkteBtn();
}

/* ---------- Türchen öffnen ---------- */
function openDoor(d){
  const type = doorType(d);
  const pics = [d.image, ...(d.images||[])].filter(Boolean);
  const TF = TYPE_FIELDS[type] || [];
  const hints = TF.includes('hints') ? (d.hints||[]).filter(h=>(h||'').trim()) : [];
  const isRiddle = type !== 'story' || !!(d.code || (d.images||[]).length || hints.length || hasPuzzle(d));
  let h = `<h2>${esc(fillName(d.title))}</h2>`;
  if(d.level) h += `<p class="lvlLine">${LEVELS[d.level]} <span>Schwierigkeit: ${LEVEL_NAMES[d.level]}</span></p>`;
  if(d.image) h += `<img src="${d.image}" alt="${esc(d.title)}" class="zoomable" data-i="0">`;
  if(d.text) h += `<div class="storyText">${fmtText(fillName(d.text))}</div>`;
  if(TF.includes('intro') && (d.intro||'').trim()) h += `<div class="introBox"><b>🔎 Dein Auftrag</b>${fmtText(fillName(d.intro))}</div>`;
  if(d.code) h += `<div class="codeBox">${esc(d.code)}</div>`;
  if(d.code && d.codeHelp) h += `<div id="decoderMount"></div>`;
  if(type === 'wordgrid' && d.wordgrid) h += `<div id="wgMount"></div>`;
  if((type === 'sudoku' || type === 'lettersudoku') && d.sudoku) h += `<div id="sdMount"></div>`;
  const MOUNTS = { anagram:'anagram', hangman:'hangman', cloze:'cloze', whoami:'whoami', match:'match', lock:'lock', maze:'maze', puzzle:'puzzle', diff:'diff', memory:'memory' };
  if(MOUNTS[type] && d[MOUNTS[type]]) h += `<div id="xMount"></div>`;
  if(type === 'crossword' && d.crossword) h += `<div id="cwMount"></div>`;
  if(type === 'quiz' && (d.quiz||[]).length) h += `<div id="qzMount"></div>`;
  (d.images||[]).forEach((src,i)=>{ h += `<img src="${src}" alt="Rätselbild ${i+1}" class="zoomable" data-i="${i + (d.image?1:0)}">`; });
  if((d.images||[]).length) h += `<p class="zoomHint">🔍 Bild anklicken oder antippen: groß ansehen und zoomen</p>`;
  if(d.video && TF.includes('video')) h += `<a class="videolink" href="${esc(d.video)}" target="_blank" rel="noopener">▶ Ansehen</a>`;
  if(isRiddle) h += `<div class="actions"><button type="button" class="pill" id="printBtn">🖨 Rätsel drucken / als PDF</button></div>`;
  if(hints.length) h += `<div class="section"><h3>Tipps</h3><div id="hintArea"></div></div>`;
  if((d.answer||'').trim() && type !== 'quiz') h += `<div class="section"><h3>Deine Lösung</h3>
      <p class="lockNote" id="lockNote" hidden></p>
      <form class="answerRow" id="answerForm"><input type="text" id="answerInput" autocomplete="off" placeholder="Antwort eintippen"><button type="submit" class="pill primary">Prüfen</button></form>
      <p class="feedback" id="feedback" aria-live="polite"></p></div>`;
  if(type === 'question' && d.reward?.img) h += `<div id="rwMount"></div>`;
  if(TF.includes('solution') && (d.solution||'').trim()) h += `<div class="section" id="solArea"></div>`;
  h += `<div id="clueArea"></div>`;
  h += `<button type="button" class="pill bottomClose" id="bottomClose">Türchen schließen</button>`;
  modalContent.innerHTML = h;
  document.getElementById('bottomClose').addEventListener('click', closeOverlay);
  if(d.code && d.codeHelp) mountDecoder(document.getElementById('decoderMount'), d.codeHelp);

  /* Antwortfeld sperren, bis das Rätsel im Türchen gelöst ist */
  const LOCK_TEXT = {
    wordgrid: ['🔒 Das Antwortfeld öffnet sich, sobald du alle Wörter im Gitter gefunden hast.', 'Erst alle Wörter finden'],
    sudoku: ['🔒 Das Antwortfeld öffnet sich, sobald das Sudoku komplett richtig ausgefüllt ist.', 'Erst das Sudoku lösen'],
    lettersudoku: ['🔒 Das Antwortfeld öffnet sich, sobald das Sudoku komplett richtig ausgefüllt ist.', 'Erst das Sudoku lösen'],
    maze: ['🔒 Das Antwortfeld öffnet sich, sobald du das Ziel im Labyrinth erreicht hast.', 'Erst ins Ziel finden'],
    crossword: ['🔒 Das Antwortfeld öffnet sich, sobald das Kreuzworträtsel komplett richtig ausgefüllt ist.', 'Erst das Kreuzworträtsel lösen'],
    puzzle: ['🔒 Das Antwortfeld öffnet sich, sobald das Bild fertig gepuzzelt ist.', 'Erst das Bild fertig puzzeln'],
    memory: ['🔒 Das Antwortfeld öffnet sich, sobald alle Memory-Paare gefunden sind.', 'Erst alle Paare finden']
  };
  const lockable = !!(LOCK_TEXT[type] && (d.answer||'').trim() && (type === 'puzzle' || type === 'memory' || d.gridLock !== false));
  const setLock = done => {
    if(!lockable) return;
    const inp = document.getElementById('answerInput'), btn = document.querySelector('#answerForm button'), note = document.getElementById('lockNote');
    if(!inp) return;
    const open = done || isSolved(d.day);
    inp.disabled = !open; btn.disabled = !open;
    inp.placeholder = open ? 'Antwort eintippen' : LOCK_TEXT[type][1];
    if(note){ note.textContent = LOCK_TEXT[type][0]; note.hidden = open; }
  };
  if(type === 'wordgrid' && d.wordgrid) mountWordGrid(document.getElementById('wgMount'), d, setLock);
  if((type === 'sudoku' || type === 'lettersudoku') && d.sudoku) mountSudoku(document.getElementById('sdMount'), d, setLock);
  if(type === 'crossword' && d.crossword) mountCrossword(document.getElementById('cwMount'), d, setLock);
  if(type === 'maze' && d.maze) mountMaze(document.getElementById('xMount'), d, setLock);
  if(type === 'whoami' && d.whoami) mountWhoAmI(document.getElementById('xMount'), d);
  overlay.classList.add('show');
  modal.scrollTop = 0;

  modalContent.querySelectorAll('img.zoomable').forEach(img=> img.addEventListener('click', ()=> openLightbox(pics, +img.dataset.i, d.day)));
  document.getElementById('printBtn')?.addEventListener('click', ()=> printDoor(d));

  const drawHints = ()=>{
    const area = document.getElementById('hintArea'); if(!area) return;
    const n = Math.min(getHintCount(d.day), hints.length);
    area.innerHTML = hints.slice(0,n).map((t,i)=>`<div class="hintItem"><b>Tipp ${i+1}:</b> ${esc(t)}</div>`).join('')
      + (n < hints.length ? `<button type="button" class="pill" id="nextHint">💡 Tipp ${n+1} zeigen</button>` : '');
    document.getElementById('nextHint')?.addEventListener('click', ()=>{ setHintCount(d.day, n+1); drawHints(); drawSolution(); });
  };
  let confirmReveal = false;
  const solMode = d.solMode || 'hints';
  const canReveal = ()=>{
    if(solMode === 'always') return true;
    if(solMode === 'hints') return getHintCount(d.day) >= hints.length;
    if(solMode === 'nextday'){ const now = new Date(), m = now.getMonth()+1; return previewMode || (m === CALENDAR_MONTH && now.getDate() > d.day) || m < 3; }
    return false;
  };
  const LOCK_SOL = { hints:'🔒 Die Lösung kann aufgedeckt werden, sobald du alle Tipps angesehen hast.', solved:'🔒 Die Lösung erscheint, sobald du das Rätsel gelöst hast.', nextday:'🔒 Die Lösung gibt es ab morgen.' };
  const drawSolution = ()=>{
    const area = document.getElementById('solArea'); if(!area) return;
    if(isSolved(d.day) || isRevealed(d.day)){
      area.innerHTML = `<h3>Lösung</h3><div class="solutionBox">${esc(d.solution)}</div>`;
    } else if(!canReveal()){
      area.innerHTML = `<p class="lockNote" style="margin:0">${LOCK_SOL[solMode]}</p>`;
    } else {
      area.innerHTML = `<button type="button" class="pill" id="revealBtn">${confirmReveal ? 'Wirklich aufdecken? Zum Bestätigen nochmal drücken' : '🔓 Lösung zeigen'}</button>`;
      document.getElementById('revealBtn').addEventListener('click', ()=>{
        if(!confirmReveal){ confirmReveal = true; drawSolution(); return; }
        lsAdd(revealedKey, d.day); drawSolution(); drawClue(); updateAkteBtn();
      });
    }
  };
  const drawClue = ()=>{
    const area = document.getElementById('clueArea');
    area.innerHTML = clueUnlocked(d) ? `<div class="clueBox"><b>📁 Neu in der Ermittlungsakte</b>${esc(d.clue)}</div>` : '';
    const bl = bwLetterOf(d.day);
    if(bl && bwEarned(d.day)) area.innerHTML += `<div class="bwBox">🔠 Dein Buchstabe für das große Lösungswort: <b style="font-size:20px">${esc(bl.ch)}</b> (Feld ${bl.pos})</div>`;
    updateAkteBtn();
  };
  drawHints(); drawSolution(); drawClue();

  const markSolved = ()=>{
    if(!isSolved(d.day)){ lsAdd(solvedKey, d.day); render(); celebrate(d, doorType(d)); }
    drawSolution(); drawClue();
  };
  if(type === 'quiz' && (d.quiz||[]).length) mountQuiz(document.getElementById('qzMount'), d, markSolved);
  const SELF = { anagram:mountAnagram, hangman:mountHangman, cloze:mountCloze, match:mountMatch, lock:mountLock, puzzle:mountPuzzle, diff:mountDiff, memory:mountMemory };
  if(type === 'puzzle' && d.puzzle && (d.answer||'').trim()){ setLock(false); mountPuzzle(document.getElementById('xMount'), d, ()=> setLock(true)); }
  else if(type === 'memory' && d.memory && (d.answer||'').trim()){ setLock(false); mountMemory(document.getElementById('xMount'), d, ()=> setLock(true)); }
  else if(SELF[type] && d[type]) SELF[type](document.getElementById('xMount'), d, markSolved);

  const form = document.getElementById('answerForm');
  if(form){
    const fb = document.getElementById('feedback');
    const rw = type === 'question' && d.reward?.img ? document.getElementById('rwMount') : null;
    const showReward = ()=>{ if(!rw || rw.dataset.on) return; rw.dataset.on = '1';
      rw.innerHTML = `<div class="section"><h3>🧩 Deine Belohnung</h3><p style="margin-top:0">Setze das Bild wieder zusammen.</p><div id="rwPz"></div><p class="feedback ok" id="rwDone" hidden>🎉 Geschafft! Das Bild ist fertig.</p></div>`;
      mountPuzzle(document.getElementById('rwPz'), { ...d, puzzle: d.reward }, ()=>{ document.getElementById('rwDone').hidden = false; }); };
    if(isSolved(d.day)){ fb.textContent = '✓ Schon gelöst!'; fb.className='feedback ok'; showReward(); }
    form.addEventListener('submit', e=>{
      e.preventDefault();
      const given = norm(document.getElementById('answerInput').value);
      if(!given){ fb.textContent = 'Bitte zuerst eine Antwort eintippen.'; fb.className='feedback bad'; return; }
      const ok = d.answer.split('|').map(norm).filter(Boolean).includes(given);
      if(ok){
        lsAdd(solvedKey, d.day); if(!rw) celebrate(d, type);
        fb.textContent = rw ? '🎉 Richtig! Als Belohnung wartet unten ein Puzzle.' : '🎉 Richtig! Gut kombiniert.'; fb.className='feedback ok';
        if(rw){ showReward(); setTimeout(()=> rw.scrollIntoView({behavior:'smooth', block:'start'}), 150); }
        drawSolution(); drawClue(); render();
        if(type === 'whoami') mountWhoAmI(document.getElementById('xMount'), d);
      } else {
        fb.innerHTML = rw ? '<span style="font-size:30px; vertical-align:middle">👎</span> Leider falsch. Versuch es nochmal!' : 'Leider nicht. Versuch es nochmal oder hol dir einen Tipp.'; fb.className='feedback bad';
      }
    });
  }
}
function norm(s){
  return String(s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]/g,'');
}
